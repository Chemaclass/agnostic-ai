name: dev
description: Install development tools and Git hooks using the existing Go toolchain.
install: |
  export PATH="$(go env GOPATH)/bin:$PATH"
  go mod download
  make tools
  make hooks
  make build
  .agnostic-ai/scripts/sync-generated.sh
x-copilot:
  setup-steps:
    timeout-minutes: 30
    steps:
      - uses: "actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7"
        with:
          go-version-file: go.mod

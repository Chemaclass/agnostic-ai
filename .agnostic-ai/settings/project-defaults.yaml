# Approve safe read-only and build commands without a prompt, and ask
# before an agent edits a built file. Nothing here allows a push, a
# delete, network access or an arbitrary shell command.
permissions:
  allow:
    - shell(go build:*)
    - shell(go test:*)
    - shell(go vet:*)
    - shell(gofmt -l:*)
    - shell(make test-short)
    - shell(./agnostic-ai sync)
    - shell(./agnostic-ai sync --check)
    - shell(./agnostic-ai lint)
    - shell(git status:*)
    - shell(git diff:*)
    - shell(git log:*)
# Sync outputs (AGENTS.md, CLAUDE.md, .claude/, .openhands/) are left out:
# lint warns that protecting them guards the output while the source stays
# open (LINT022), and CI's drift check fails on a hand edit to them.
protected:
  paths:
    - ui/embedded/
    - docs/schemas/config.schema.json
  decision: ask
  reason: This file is built. Edit ui/src/ and run make ui-build, or edit the config types and run go run ./cmd/schemagen.

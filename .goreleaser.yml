version: 2

project_name: agnostic-ai

before:
  hooks:
    - go mod tidy

builds:
  - id: agnostic-ai
    main: ./cmd/agnostic-ai
    binary: agnostic-ai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: checksums.txt

changelog:
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Tests
      regexp: '^.*?test(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Chores
      regexp: '^.*?chore(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: Others
      order: 999

scoops:
  - name: agnostic-ai
    # Without a token (local run, fork, secret not configured yet) the manifest
    # is still built but never pushed, so the release itself keeps working.
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: Chemaclass
      name: scoop-bucket
      branch: main
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    homepage: https://github.com/Chemaclass/agnostic-ai
    description: Sync agent prompts, skills, rules, and hooks across AI coding tools
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "feat: bump {{ .ProjectName }} to {{ .Tag }}"

winget:
  - name: agnostic-ai
    package_identifier: Chemaclass.agnostic-ai
    publisher: Chemaclass
    publisher_url: https://github.com/Chemaclass
    publisher_support_url: https://github.com/Chemaclass/agnostic-ai/issues
    homepage: https://github.com/Chemaclass/agnostic-ai
    license: MIT
    license_url: https://github.com/Chemaclass/agnostic-ai/blob/main/LICENSE
    short_description: Sync agent prompts, skills, rules, and hooks across AI coding tools
    description: |
      Write your agents, skills, rules, and hooks once and emit them to every
      AI coding CLI in its native format: Claude Code, Codex, Gemini, Cursor,
      Copilot, and 20 more.
    release_notes_url: "https://github.com/Chemaclass/agnostic-ai/releases/tag/{{ .Tag }}"
    tags:
      - ai
      - cli
      - developer-tools
      - agents
    skip_upload: '{{ if isEnvSet "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "New version: {{ .ProjectName }} {{ .Tag }}"
    # Manifests land on a branch in our own fork, then open a PR against the
    # upstream catalog. Microsoft reviews and merges it, so a new version shows
    # up in `winget search` a while after the GitHub release.
    repository:
      owner: Chemaclass
      name: winget-pkgs
      branch: "agnostic-ai-{{ .Version }}"
      token: '{{ envOrDefault "WINGET_TOKEN" "" }}'
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

homebrew_casks:
  - name: agnostic-ai
    binaries:
      - agnostic-ai
    repository:
      owner: Chemaclass
      name: homebrew-tap
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Chemaclass/agnostic-ai
    description: Sync agent prompts, skills, rules, and hooks across AI coding tools
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "feat: bump {{ .ProjectName }} to {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agnostic-ai"]
          end

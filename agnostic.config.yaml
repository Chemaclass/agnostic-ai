# agnostic-ai project config
#
# This repo dogfoods the tool: source specs live under .agnostic-ai/
# and `agnostic-ai sync` regenerates the per-CLI configs in the working tree.
#
# Generated outputs (CLAUDE.md, AGENTS.md, .cursor/, etc.) stay in .gitignore.

version: 1

# Source directories, relative to this file.
sources:
  agents: .agnostic-ai/agents
  skills: .agnostic-ai/skills
  rules: .agnostic-ai/rules
  hooks: .agnostic-ai/hooks
  mcps: .agnostic-ai/mcps

# AI CLIs to emit configs for. Comment any out to skip.
targets:
  - claude        # Claude Code (Anthropic)
  - codex         # Codex CLI (OpenAI)
  - gemini        # Gemini CLI (Google)
  - cursor        # Cursor (cursor.com)
  - copilot       # GitHub Copilot
  - aider         # Aider (aider.chat)
  - cline         # Cline (VSCode extension)
  - windsurf      # Windsurf (Codeium)
  - continue      # Continue (continue.dev)

# What to do when a target does not support a spec kind.
on-unsupported: warn   # warn | error | silent

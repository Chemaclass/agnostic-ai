<!doctype html>
<html lang="en" data-motion="off">
<head>
  <meta charset="utf-8">
  <title>agnostic-ai conversations</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/panel.css">
  <script type="module" src="/motion.js"></script>
  <script type="module" src="/panel.js"></script>
</head>
<body>
  <main class="card" id="card" data-from="bottom-right">
    <header class="head">
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
        <input id="query" type="text" maxlength="200" placeholder="Search every conversation" aria-label="Search every conversation" aria-controls="list" autocomplete="off" spellcheck="false">
        <button class="clear" id="clear" type="button" aria-label="Clear the search" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </label>
      <button class="dashboard" id="dashboard" type="button" aria-label="Open the dashboard" title="Open the full dashboard and see your global configuration folder">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 7.4L8 2.8l5.5 4.6V13H9.6V9.6H6.4V13H2.5z"/></svg>
        Dashboard
      </button>
    </header>
    <section class="approvals-bar" id="approvals-bar" aria-label="Approvals" hidden>
      <p class="approvals-mode" id="approvals-mode" role="status"></p>
      <button class="approvals-ask" id="approvals-ask" type="button" title="Show every permission prompt again, from the next request on">Ask me</button>
    </section>
    <section class="pick" id="pick" aria-label="Send the copied text" hidden>
      <p class="pick-title" id="pick-title" role="status"></p>
      <button class="icon-button pick-close" id="pick-close" type="button" aria-label="Stop sending" title="Stop sending (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
      <p class="pick-preview" id="pick-preview"></p>
    </section>
    <p class="note" id="mailbox-warning" role="status" hidden></p>
    <form class="mailbox-card" id="mailbox-compose" aria-labelledby="mailbox-compose-title" hidden>
      <strong id="mailbox-compose-title">Send to session</strong>
      <output class="mailbox-muted" id="mailbox-from"></output>
      <label>Session ID <input id="mailbox-target" autocomplete="off" spellcheck="false" aria-describedby="mailbox-target-hint"></label>
      <p class="mailbox-muted" id="mailbox-target-hint">Click a session in the list or paste its ID here.</p>
      <label>Type <select id="mailbox-type"><option value="question">Question</option><option value="finding">Finding</option></select></label>
      <label>Message <textarea id="mailbox-body" rows="2"></textarea></label>
      <div class="mailbox-actions">
        <button class="confirm-cancel" id="mailbox-cancel" type="button">Cancel</button>
        <button class="mailbox-send" id="mailbox-send" type="submit">Send message</button>
      </div>
    </form>
    <section class="mailbox-card mailbox-details" id="mailbox-details" aria-labelledby="mailbox-details-title" hidden>
      <header class="mailbox-header">
        <strong id="mailbox-details-title"></strong>
        <button class="icon-button" id="mailbox-dismiss" type="button" aria-label="Dismiss thread" title="Dismiss thread">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-linecap="round"/></svg>
        </button>
      </header>
      <p class="mailbox-muted" id="mailbox-details-meta"></p>
      <div class="mailbox-messages" id="mailbox-messages"></div>
      <p id="mailbox-result" role="status" hidden></p>
      <div class="mailbox-actions" id="mailbox-thread-actions"></div>
    </section>
    <p class="note" id="note" role="status" hidden></p>
    <section class="notice" id="notice" aria-label="Why it did not open" data-tone="info" hidden>
      <svg class="tone-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 2.6L14 13H2zM8 6.7v3.1M8 11.3v.1"/></svg>
      <p class="notice-message" id="notice-message" role="status"><span class="unseen" id="notice-about"></span><span id="notice-text"></span></p>
      <button class="icon-button notice-dismiss" id="notice-dismiss" type="button" aria-label="Dismiss" title="Dismiss">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
      <code class="notice-command" id="notice-command" hidden></code>
      <div class="notice-actions">
        <button class="notice-copy" id="notice-copy" type="button" hidden>Copy resume command</button>
        <p class="notice-result" id="notice-result" role="status" hidden></p>
      </div>
    </section>
    <section class="notice confirm" id="delete-confirm" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-body" hidden>
      <p class="confirm-title" id="delete-title"></p>
      <p class="confirm-details" id="delete-details"></p>
      <p class="confirm-body" id="delete-body"></p>
      <div class="notice-actions confirm-actions">
        <button class="confirm-cancel" id="delete-cancel" type="button">Cancel</button>
        <button class="confirm-delete" id="delete-go" type="button">Delete permanently</button>
      </div>
    </section>
    <section class="notice confirm" id="stop-shell-dialog" role="alertdialog" aria-modal="true" aria-labelledby="stop-shell-title" aria-describedby="stop-shell-command stop-shell-details" hidden>
      <p class="confirm-title" id="stop-shell-title">Stop shell?</p>
      <select class="stop-shell-choice" id="stop-shell-choice" aria-label="Choose a shell" hidden></select>
      <code class="stop-shell-command" id="stop-shell-command" hidden></code>
      <p class="confirm-details" id="stop-shell-details" hidden></p>
      <div class="notice-actions confirm-actions">
        <button class="confirm-cancel" id="stop-shell-cancel" type="button">Cancel</button>
        <button class="confirm-delete" id="stop-shell-go" type="button">Stop shell</button>
      </div>
    </section>
    <section class="notice confirm" id="stop-session-confirm" role="alertdialog" aria-modal="true" aria-labelledby="stop-session-title" aria-describedby="stop-session-body" hidden>
      <p class="confirm-title" id="stop-session-title"></p>
      <p class="confirm-body" id="stop-session-body"></p>
      <div class="notice-actions confirm-actions">
        <button class="confirm-cancel" id="stop-session-cancel" type="button">Cancel</button>
        <button class="confirm-delete" id="stop-session-go" type="button">Stop chat</button>
      </div>
    </section>
    <section class="notice confirm" id="quit-confirm" role="alertdialog" aria-modal="true" aria-labelledby="quit-title" aria-describedby="quit-body" hidden>
      <p class="confirm-title" id="quit-title">Quit Agnostic AI companion?</p>
      <p class="confirm-body" id="quit-body">Quit stops the program, so the shortcut will not bring it back. Open the app again, or run <code>agnostic-ai companion</code> to restart it. The shortcut works only after Hide.</p>
      <div class="notice-actions confirm-actions">
        <button class="confirm-cancel" id="quit-cancel" type="button">Cancel</button>
        <button class="confirm-cancel" id="quit-hide" type="button">Hide instead</button>
        <button class="confirm-delete" id="quit-go" type="button">Quit</button>
      </div>
    </section>
    <div class="list" id="list" role="listbox" aria-label="Conversations" tabindex="-1"><p class="loading-conversations" role="status">Loading conversations…</p></div>
    <footer class="foot">
      <div class="places" id="places" role="group" aria-label="Where the conversations run"></div>
      <span class="summary" id="summary" role="status"></span>
      <button class="icon-button" id="menu-button" type="button" aria-label="Settings" title="Settings" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/></svg>
      </button>
    </footer>
    <!-- panel.js builds the rows from menu.json, which the right-click menu shows too. -->
    <section class="menu" id="menu" aria-label="Settings" hidden>
      <p class="config-location" id="config-location" hidden></p>
      <p class="menu-problem" id="menu-problem" role="status" hidden></p>
    </section>
    <div class="menu row-menu" id="row-menu" role="menu" aria-label="Conversation" hidden>
      <button class="menu-item" id="mark-read" type="button" role="menuitem" title="Takes it out of Needs you without opening it, until something new is written">Mark as read</button>
      <button class="menu-item" id="rename" type="button" role="menuitem">Rename…</button>
      <button class="menu-item" id="copy-session-id" type="button" role="menuitem">Copy session ID</button>
      <button class="menu-item" id="send-to" type="button" role="menuitem" aria-controls="mailbox-compose">Send to session…</button>
      <button class="menu-item" id="complete" type="button" role="menuitem" title="Marks it complete until something new is written or it starts working">Mark complete</button>
      <button class="menu-item" id="reopen" type="button" role="menuitem" title="Clears the completion mark you set">Undo complete</button>
      <button class="menu-item" id="hide" type="button" role="menuitem" title="Takes it out of every list and search, until something new is written or it starts working. The tool keeps the chat.">Hide from agnostic-ai</button>
      <button class="menu-item" id="open-web" type="button" role="menuitem" title="Also open on claude.ai">Open on claude.ai</button>
      <button class="menu-item is-danger" id="delete" type="button" role="menuitem" title="Removes the chat from this computer. It cannot be undone.">Delete permanently…</button>
      <button class="menu-item is-danger" id="stop-shell" type="button" role="menuitem">Stop shell…</button>
      <button class="menu-item is-danger" id="stop-session" type="button" role="menuitem" title="Ends the chat's Claude Code process on this computer. The transcript stays.">Stop chat…</button>
    </div>
    <p class="toast" id="toast" role="status" data-tone="info" hidden><svg class="tone-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 2.6L14 13H2zM8 6.7v3.1M8 11.3v.1"/></svg><span id="toast-text"></span></p>
  </main>
</body>
</html>

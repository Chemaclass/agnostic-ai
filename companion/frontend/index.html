<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agnostic Companion</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/bubble.css">
  <script type="module" src="/bubble.js"></script>
</head>
<body>
  <button class="bubble" id="bubble" type="button" aria-label="Conversations">
    <span class="ring" aria-hidden="true"></span>
    <span class="disc" aria-hidden="true">
      <!-- The focused grid mark, as in docs/site/static/favicon.svg. -->
      <svg class="mark" viewBox="0 0 64 64" focusable="false">
        <g class="dots">
          <circle cx="14" cy="14" r="4.5"/><circle cx="32" cy="14" r="4.5"/><circle cx="50" cy="14" r="4.5"/>
          <circle cx="14" cy="32" r="4.5"/><circle cx="50" cy="32" r="4.5"/>
          <circle cx="14" cy="50" r="4.5"/><circle cx="32" cy="50" r="4.5"/><circle cx="50" cy="50" r="4.5"/>
        </g>
        <circle class="focus-dot" cx="32" cy="32" r="4.5"/>
        <circle class="focus-ring" cx="32" cy="32" r="10"/>
      </svg>
    </span>
    <span class="badge" id="badge" hidden>
      <svg class="lock" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.6 7h6.8a1.6 1.6 0 0 1 1.6 1.6v3.8a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 12.4V8.6A1.6 1.6 0 0 1 4.6 7zM5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
      <svg class="terminal" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.6 2.5h8.8a1.6 1.6 0 0 1 1.6 1.6v7.8a1.6 1.6 0 0 1-1.6 1.6H3.6A1.6 1.6 0 0 1 2 11.9V4.1a1.6 1.6 0 0 1 1.6-1.6zM5 6l2.2 2L5 10M8.8 10.5h2.4"/></svg>
      <span id="count"></span>
    </span>
  </button>
</body>
</html>

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    misspell:
      locale: US
    revive:
      severity: warning
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/chemaclass/agnostic-ai

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

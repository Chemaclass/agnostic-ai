name: New adapter request
description: Name the AI coding tool you'd like to use with agnostic-ai.
title: "adapter: "
labels: ["enhancement"]
body:
  - type: input
    id: target
    attributes:
      label: Tool name
      description: Which AI coding tool should agnostic-ai support?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Official link (optional)
      description: Homepage or repository URL, if you have it.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: What you'd like to sync, documentation, or config examples. No need to research the tool's internals.
    validations:
      required: false

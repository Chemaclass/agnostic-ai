name: New adapter request
description: Name the AI coding tool you'd like to use with agnostic-ai.
title: "adapter: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with a short idea or problem. The issue body is the source of truth; update it as the plan changes. Maintainers choose one feature label by the outcome, alongside type and source labels. See the [triage guide](https://github.com/Chemaclass/agnostic-ai/blob/main/docs/internal/issue-triage.md).
  - type: input
    id: target
    attributes:
      label: Tool name
      description: Which AI coding tool should agnostic-ai support?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Official link (optional)
      description: Homepage or repository URL, if you have it.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: What you'd like to sync, documentation, or config examples. No need to research the tool's internals.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Implementation or verification links (optional)
      description: Link a pull request, test run, screenshot, or other evidence if it already exists. Add the result before closing a completed issue.
    validations:
      required: false

name: Feature request
description: Tell us what you want to do or what gets in your way.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe your use case or the problem. You don't need to propose a solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution (optional)
      description: Share an idea if you have one.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Examples, links, or screenshots that help explain your request.
    validations:
      required: false

name: Bug report
description: Tell us what went wrong. A short description is enough.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe what happened and what you expected. Share what you know; we can follow up for details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce (optional)
      description: A command or a few steps help if you have them.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional details (optional)
      description: Version, operating system, logs, config snippets, or screenshots. Leave this blank if you don't have them handy.
    validations:
      required: false

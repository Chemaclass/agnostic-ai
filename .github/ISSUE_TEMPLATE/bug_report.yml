name: Bug report
description: Report a defect in agnostic-ai.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence summary of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agnostic-ai --version`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS name and version (e.g. macOS 14.5, Ubuntu 22.04, Windows 11).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce.
      placeholder: |
        1. Run `agnostic-ai ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, config snippets, screenshots, anything else useful.
    validations:
      required: false

name: Pages

# Builds the Zola site and WebAssembly playground, assembles the playground
# under /playground/, and publishes everything to GitHub Pages on every push
# to main and on demand. Tag pushes are intentionally
# excluded: the release commit lands on main first and triggers a deploy
# through that path. The github-pages environment is branch-restricted to
# main, so a tag-triggered deploy would fail the protection rule.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  attestations: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: sitemap lastmod comes from each page's real commit
          # date, and a shallow clone cannot resolve it.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Zola 0.22.0
        env:
          GH_TOKEN: ${{ github.token }}
          ZOLA_VERSION: 0.22.0
        run: |
          set -euo pipefail
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$archive" "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${archive}"
          gh attestation verify "$archive" --repo getzola/zola
          tar -xzf "$archive" zola
          sudo install -m 0755 zola /usr/local/bin/zola
          test "$(zola --version)" = "zola ${ZOLA_VERSION}"

      - name: Test site publishing
        run: make site-test

      - name: Build site
        run: make site-build

      - name: Build playground
        run: make playground-build

      - name: Report sizes
        run: |
          ls -lh docs/playground/
          gzip -c docs/playground/agnostic-ai.wasm | wc -c | awk '{printf "wasm gzipped: %d bytes\n", $1}'

      - name: Assemble playground
        run: |
          mkdir -p _site/playground
          cp -R docs/playground/. _site/playground/

      - name: Build llms-full.txt
        run: |
          set -euo pipefail

          # One fetch that gives an agent every user doc, in reading order.
          {
            echo "# agnostic-ai: full documentation"
            echo
            echo "Generated from docs/user/ at ${GITHUB_SHA}. Source of truth:"
            echo "https://github.com/Chemaclass/agnostic-ai"
            for doc in README installation getting-started migration troubleshooting \
                       why spec-format targets target-updates configuration \
                       cli-reference ci packs git-hooks graph errors \
                       alternatives-why-not-symlinks; do
              echo
              echo "---"
              echo
              cat "docs/user/${doc}.md"
            done
          } > _site/llms-full.txt

          ls -lh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

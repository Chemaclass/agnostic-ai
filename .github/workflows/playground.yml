name: Pages

# Builds the WebAssembly playground, assembles the site (landing page at
# the root, playground under /playground/), and publishes it to GitHub
# Pages on every push to main and on demand. Tag pushes are intentionally
# excluded: the release commit lands on main first and triggers a deploy
# through that path. The github-pages environment is branch-restricted to
# main, so a tag-triggered deploy would fail the protection rule.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: sitemap lastmod comes from each page's real commit
          # date, and a shallow clone cannot resolve it.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build playground
        run: make playground-build

      - name: Report sizes
        run: |
          ls -lh docs/playground/
          gzip -c docs/playground/agnostic-ai.wasm | wc -c | awk '{printf "wasm gzipped: %d bytes\n", $1}'

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/site/. _site/
          mkdir -p _site/playground
          cp -R docs/playground/. _site/playground/

      - name: Build sitemap and llms-full.txt
        run: |
          set -euo pipefail

          # Each page keeps its own commit date, and new update articles are
          # discovered automatically instead of extending this workflow.
          ./scripts/build-site-sitemap.sh _site/sitemap.xml

          # One fetch that gives an agent every user doc, in reading order.
          {
            echo "# agnostic-ai: full documentation"
            echo
            echo "Generated from docs/user/ at ${GITHUB_SHA}. Source of truth:"
            echo "https://github.com/Chemaclass/agnostic-ai"
            for doc in README installation getting-started migration troubleshooting \
                       why spec-format targets target-updates configuration \
                       cli-reference ci packs git-hooks graph errors \
                       alternatives-why-not-symlinks; do
              echo
              echo "---"
              echo
              cat "docs/user/${doc}.md"
            done
          } > _site/llms-full.txt

          ls -lh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

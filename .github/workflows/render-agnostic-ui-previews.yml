name: Render Agnostic AI reference images

# Keep the issue's visual references as actual PNG screenshots rather than
# relying on GitHub's inconsistent inline rendering of raw SVG files.
on:
  push:
    branches:
      - motechfr/metaprogramming-1323
    paths:
      - .github/workflows/render-agnostic-ui-previews.yml
      - docs/internal/assets/metaprogramming/chat-previews/**.svg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Install SVG renderer
        run: python -m pip install cairosvg
      - name: Validate and render PNGs
        run: |
          python - <<'PY'
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import cairosvg

          folder = Path("docs/internal/assets/metaprogramming/chat-previews")
          originals = sorted(folder.glob("*.svg"))
          if len(originals) < 5:
              raise SystemExit("Expected five issue reference images")
          for source in originals:
              ET.parse(source)  # Fail rather than publish malformed SVGs
              output = source.with_suffix(".png")
              cairosvg.svg2png(bytestring=source.read_bytes(), write_to=str(output), scale=1.5)
              data = output.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise RuntimeError(f"Invalid PNG: {output}")
              width, height = struct.unpack(">II", data[16:24])
              if min(width, height) < 500:
                  raise RuntimeError(f"Unexpected image dimensions: {output}")
              print(f"{output}: {width}x{height}, {len(data)} bytes")
          PY
      - name: Commit rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/assets/metaprogramming/chat-previews/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(ui): render issue reference images as PNG"
            git push
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC daily. An odd minute so this does not join the stampede of
    # cron jobs that every project schedules on the hour.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      full_windows:
        description: Run the full Windows Go race suite (ten-minute job limit)
        type: boolean
        default: false
      repeat_windows_startup:
        description: Repeat the Windows fresh-install launcher test ten times
        type: boolean
        default: false

permissions:
  contents: read

# The pull request number is set only for pull_request, so every push to a
# PR shares one group and cancels the previous run instead of paying for a
# second full matrix that nobody reads. Pushes to main fall back
# to `run_id`, which is unique per run, so a main run never queues behind
# or cancels another and every commit on the default branch keeps its own
# full run.
#
# Keyed on the number rather than `head_ref`: a branch name is not unique
# across forks, and GitHub's web editor defaults every one of them to
# `patch-1`, so two outside contributors would have cancelled each other's
# runs (#850).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests and pushes to main test on Linux: a merge reruns code its PR
  # already tested, and a full matrix on every merge tripled the runner time.
  # Nightly and manual runs add macOS and a focused Windows smoke check.
  # The full Windows Go suite is manual only, with full_windows=true.
  test:
    name: Test
    timeout-minutes: ${{ matrix.os == 'windows-latest' && inputs.full_windows != true && 7 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -timeout=10m -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test
        if: matrix.os == 'windows-latest' && inputs.full_windows == true
        shell: bash
        run: go test -vet=all -timeout=10m -count=1 -race ./...

      - name: macOS unit tests
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          module=$(go list -m)
          all_packages=$(go list ./...)
          packages=()
          while IFS= read -r package; do
            case "$package" in
              "$module/tests/integration"|"$module/tests/integration/"*|"$module/internal/cli") ;;
              *) packages+=("$package") ;;
            esac
          done <<< "$all_packages"
          go test -vet=all -timeout=10m -count=1 -race "${packages[@]}"

      - name: Windows smoke
        if: matrix.os == 'windows-latest' && inputs.full_windows != true
        shell: bash
        run: |
          go test -timeout=5m -count=1 ./internal/config ./internal/adapters/internal/emit ./internal/adapters/pi ./internal/adapters/grok ./internal/adapters/qwen ./internal/adapters/vibe ./internal/adapters/kimi ./internal/adapters/codebuddy
          go test -timeout=5m -count=1 ./internal/adapters/cline -run 'VSCode|GlobalHooks_|ActualBuiltin'
          go test -timeout=5m -count=1 ./internal/cli -run '^(TestCodebuddy_(Import|Scoped|Controlled|Instruction|DeleteCapability|Overrides|GlobalRejects|DefaultSync)|TestInstallHook_SharedFromLinkedWorktreeWritesUnderMainToplevel$|TestHandoffList_|TestSessionRetention_|TestSyncGlobal_Cline|TestInit_Memory|TestHookMemory_Trae|TestHookMemory_Devin|TestSync_DevinMemory|TestHookMemory_Augment|TestSyncGlobal_AugmentMemory|TestSyncGlobal_AugmentLocal|TestSync_AugmentLocal|TestSync_AntigravityMemory|TestSyncGlobal_AntigravityMemory|TestHookMemory_Cline|TestHookRun_ClineVSCode|TestHookRun_VSCodeRuntime|TestSync_ClineUnixRemoves|TestGitRepo_DoesNotStartAutomaticMaintenance$|TestImportPi_|TestImportGlobal_Pi|TestSyncGlobal_Pi|TestSyncPi_|TestPiExposure_|TestPiMCPMap_|TestPiBOM_|TestLintMCPMissingRequiredField_PiControls|TestImportGrok_|TestSyncGlobal_Grok|TestGrokTOML_|TestQwen_|TestImportVibe_|TestSyncVibe_|TestSyncGlobal_Vibe|TestImportGlobal_Vibe|TestImportKimi_|TestSyncKimi_|TestSyncGlobal_Kimi|TestImportGlobal_Kimi|TestTOMLArray_)'
          go test -timeout=5m -count=1 ./tests/integration -run '^(TestProjectLifecycle_FirstLaunchAfterFreshInstall|TestProjectLifecycle_LaunchDiagnostic.*|TestPiRoundTrip_NativeProject|TestGrokNativeProject_ImportSyncCheckAndLint|TestQwenNativeProject_BuiltBinaryImportSyncCheck|TestVibeRoundTrip_NativeProject|TestKimiRoundTrip_NativeProject|TestCodebuddy_NativeImportRecreatesAnEmptyOutputTree)$'

      - name: Repeat Windows fresh-install startup
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest' && inputs.full_windows != true && inputs.repeat_windows_startup == true
        timeout-minutes: 3
        shell: bash
        env:
          AGNOSTIC_AI_WINDOWS_STARTUP_TESTS: "1"
        run: go test -v -failfast -timeout=3m -count=10 ./tests/integration -run '^TestProjectLifecycle_FirstLaunchAfterFreshInstall$'

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  # internal/cli alone runs close to ten minutes under -race on macOS, so it
  # gets its own job, split in two by test name; -skip keeps the halves
  # complementary, so a new test lands in one of them.
  macos-cli:
    name: Test cli (macos-latest, ${{ matrix.shard }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a-l
            run: '^Test[A-L]'
            skip: ''
          - shard: m-z
            run: ''
            skip: '^Test[A-L]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: bash
        run: go test -vet=all -timeout=10m -count=1 -race ./internal/cli -run '${{ matrix.run }}' -skip '${{ matrix.skip }}'

  windows-handoffs:
    name: Test handoffs (windows-latest, ${{ matrix.suite }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.full_windows != true
    runs-on: windows-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: hooks-worktrees
            tests: '^TestBuiltinHandoffHooks$/^(automatic-snapshots-preserve-repository-boundaries|metadata-and-replacement-failures-preserve-files|claude-native-input-validation|shared-auto-snapshots-survive-worktrees|global-source-at-home-keeps-checkout-root|task-handoffs-across-worktrees)$'
            skip: ''
          - suite: hooks-rest
            tests: '^TestBuiltinHandoffHooks$'
            skip: '^TestBuiltinHandoffHooks$/^(automatic-snapshots-preserve-repository-boundaries|metadata-and-replacement-failures-preserve-files|claude-native-input-validation|shared-auto-snapshots-survive-worktrees|global-source-at-home-keeps-checkout-root|task-handoffs-across-worktrees)$'
          - suite: permissions-shared-store
            tests: '^TestHandoffAccess_(SharedStoreJoinsNativeWriteRoots|EveryGrantAddedByHandSurvives)$'
            skip: ''
          - suite: permissions-rest
            tests: '^TestHandoffAccess_'
            skip: '^TestHandoffAccess_(SharedStoreJoinsNativeWriteRoots|EveryGrantAddedByHandSurvives)$'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: bash
        run: go test -timeout=5m -count=1 ./tests/integration -run '${{ matrix.tests }}' -skip '${{ matrix.skip }}'

  macos-integration:
    name: Test integration (macos-latest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: bash
        run: go test -vet=all -timeout=10m -count=1 -race ./tests/integration/...


  opencode-hooks:
    name: OpenCode hooks
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 7 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/vendor/opencode/package-lock.json

      - name: Validate released plugin types and native behavior
        shell: bash
        run: make opencode-hooks-test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Fails only on a known vulnerability the code can reach, so a flaw in
      # an unused corner of a dependency does not block every PR. The daily
      # scheduled run catches a new advisory against code already on main.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build WASM playground
        run: GOOS=js GOARCH=wasm go build -o /tmp/agnostic-ai.wasm ./cmd/agnostic-ai-wasm

      - name: Test WASM playground
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/agnostic-ai-wasm

      - name: Test OpenCode browser permissions
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/adapters/opencode -run '^TestProjectPermissionBrowserReplaysPlannedRulesWithoutFilesystem$'

      - name: Test browser TOML capture
        timeout-minutes: 2
        run: GOOS=js GOARCH=wasm go test -timeout=30s -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/adapters/internal/emit -run '^TestMergeTOMLFileBrowserCapturesWithoutFilesystem$'

  schema:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate schema
        run: go run ./cmd/schemagen

      - name: Fail on drift
        run: git diff --exit-code docs/schemas/config.schema.json

  speclint:
    name: Spec lint
    # Runs against this repo's own specs under .agnostic-ai/. Note there is no
    # `sync --check` counterpart: the managed .gitignore block deliberately
    # leaves emitted output uncommitted, so a fresh checkout has nothing to
    # compare against. Source specs are committed, so lint works here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Lint specs
        run: ./agnostic-ai lint

      - name: Binary size
        run: make size-check

  plugin:
    name: Plugin version bump
    # The marketplace pins the plugin to plugin.json's version, so an edit that
    # ships without a bump never reaches anyone who already installed it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Version bumped when the plugin changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          manifest=plugins/agnostic-ai/.claude-plugin/plugin.json
          # Compare against the merge base, not the base tip: another PR's
          # plugin change landing on main must not read as this PR's work.
          BASE=$(git merge-base "$BASE" "$HEAD")
          changed=$(git diff --name-only "$BASE" "$HEAD" -- plugins/ .claude-plugin/)
          if [ -z "$changed" ]; then
            echo "plugin untouched, nothing to check"
            exit 0
          fi
          echo "changed:"; echo "$changed"
          before=$(git show "$BASE:$manifest" 2>/dev/null | grep '"version"' || true)
          after=$(grep '"version"' "$manifest")
          if [ "$before" = "$after" ]; then
            echo "error: plugin files changed but $manifest version is still $after" >&2
            echo "Bump it, or installed users keep the old copy." >&2
            exit 1
          fi
          echo "version moved: ${before:-<none>} -> $after"

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One pinned release file, checked against its published sha256
      # before it runs, instead of piping an install script into bash.
      - name: Install bashunit
        env:
          BASHUNIT_VERSION: 0.51.0
          BASHUNIT_SHA256: 307e3a84d5561d1a1d8b5d378184bb1dfda3e7a7856c4a9435d63a53853cf72c
        run: |
          curl -fsSL -o /usr/local/bin/bashunit "https://github.com/TypedDevs/bashunit/releases/download/${BASHUNIT_VERSION}/bashunit"
          echo "${BASHUNIT_SHA256}  /usr/local/bin/bashunit" | sha256sum -c -
          chmod +x /usr/local/bin/bashunit

      - name: Run shell tests
        run: make test-shell

  editor_changes:
    name: Editor changes
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.filter.outputs.vscode }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" || true)
              head=$PR_HEAD
              ;;
            push)
              base=$PUSH_BEFORE
              head=$PUSH_AFTER
              ;;
            *)
              printf 'vscode=true\njetbrains=true\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            printf 'vscode=true\njetbrains=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for editor in vscode jetbrains; do
            if git diff --quiet "$base" "$head" -- "editors/$editor/" .github/workflows/ci.yml cmd/agnostic-ai/ internal/cli/ internal/config/ internal/spec/ docs/schemas/config.schema.json; then
              echo "$editor=false" >> "$GITHUB_OUTPUT"
            else
              echo "$editor=true" >> "$GITHUB_OUTPUT"
            fi
          done

  vscode:
    name: VS Code extension (${{ matrix.os }})
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 7 || 10 }}
    needs: editor_changes
    if: ${{ !cancelled() && (needs.editor_changes.result != 'success' || needs.editor_changes.outputs.vscode == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --skip-license

  jetbrains:
    name: JetBrains plugin
    needs: editor_changes
    if: ${{ !cancelled() && (needs.editor_changes.result != 'success' || needs.editor_changes.outputs.jetbrains == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fails if the committed gradle-wrapper.jar is not a published Gradle
      # release, the jar the build would otherwise run unchecked.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            editors/jetbrains/.gradle
          key: gradle-${{ hashFiles('editors/jetbrains/**/*.gradle*', 'editors/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

  ui:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC daily. An odd minute so this does not join the stampede of
    # cron jobs that every project schedules on the hour.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The pull request number is set only for pull_request, so every push to a
# PR shares one group and cancels the previous run instead of paying for a
# second full 11-check matrix that nobody reads. Pushes to main fall back
# to `run_id`, which is unique per run, so a main run never queues behind
# or cancels another and every commit on the default branch keeps its own
# full run.
#
# Keyed on the number rather than `head_ref`: a branch name is not unique
# across forks, and GitHub's web editor defaults every one of them to
# `patch-1`, so two outside contributors would have cancelled each other's
# runs (#850).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests test on Linux; main, nightly, and manual runs test all three
  # operating systems. Run the full matrix on the release commit before tagging.
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        if: matrix.os != 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build WASM playground
        run: GOOS=js GOARCH=wasm go build -o /tmp/agnostic-ai.wasm ./cmd/agnostic-ai-wasm

      - name: Test WASM playground
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/agnostic-ai-wasm

  schema:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate schema
        run: go run ./cmd/schemagen

      - name: Fail on drift
        run: git diff --exit-code docs/schemas/config.schema.json

  speclint:
    name: Spec lint
    # Runs against this repo's own specs under .agnostic-ai/. Note there is no
    # `sync --check` counterpart: the managed .gitignore block deliberately
    # leaves emitted output uncommitted, so a fresh checkout has nothing to
    # compare against. Source specs are committed, so lint works here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Lint specs
        run: ./agnostic-ai lint

  plugin:
    name: Plugin version bump
    # The marketplace pins the plugin to plugin.json's version, so an edit that
    # ships without a bump never reaches anyone who already installed it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version bumped when the plugin changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          manifest=plugins/agnostic-ai/.claude-plugin/plugin.json
          # Compare against the merge base, not the base tip: another PR's
          # plugin change landing on main must not read as this PR's work.
          BASE=$(git merge-base "$BASE" "$HEAD")
          changed=$(git diff --name-only "$BASE" "$HEAD" -- plugins/ .claude-plugin/)
          if [ -z "$changed" ]; then
            echo "plugin untouched, nothing to check"
            exit 0
          fi
          echo "changed:"; echo "$changed"
          before=$(git show "$BASE:$manifest" 2>/dev/null | grep '"version"' || true)
          after=$(grep '"version"' "$manifest")
          if [ "$before" = "$after" ]; then
            echo "error: plugin files changed but $manifest version is still $after" >&2
            echo "Bump it, or installed users keep the old copy." >&2
            exit 1
          fi
          echo "version moved: ${before:-<none>} -> $after"

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bashunit
        run: |
          curl -sSL https://bashunit.typeddevs.com/install.sh | bash -s -- /usr/local/bin

      - name: Run shell tests
        run: make test-shell

  editor_changes:
    name: Editor changes
    runs-on: ubuntu-latest
    outputs:
      vscode: ${{ steps.filter.outputs.vscode }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" || true)
              head=$PR_HEAD
              ;;
            push)
              base=$PUSH_BEFORE
              head=$PUSH_AFTER
              ;;
            *)
              printf 'vscode=true\njetbrains=true\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            printf 'vscode=true\njetbrains=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for editor in vscode jetbrains; do
            if git diff --quiet "$base" "$head" -- "editors/$editor/" .github/workflows/ci.yml cmd/agnostic-ai/ internal/cli/ internal/config/ internal/spec/ docs/schemas/config.schema.json; then
              echo "$editor=false" >> "$GITHUB_OUTPUT"
            else
              echo "$editor=true" >> "$GITHUB_OUTPUT"
            fi
          done

  vscode:
    name: VS Code extension
    needs: editor_changes
    if: ${{ !cancelled() && (needs.editor_changes.result != 'success' || needs.editor_changes.outputs.vscode == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci || npm install --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --skip-license --no-dependencies

  jetbrains:
    name: JetBrains plugin
    needs: editor_changes
    if: ${{ !cancelled() && (needs.editor_changes.result != 'success' || needs.editor_changes.outputs.jetbrains == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            editors/jetbrains/.gradle
          key: gradle-${{ hashFiles('editors/jetbrains/**/*.gradle*', 'editors/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

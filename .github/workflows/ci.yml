name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The pull request number is set only for pull_request, so every push to a
# PR shares one group and cancels the previous run instead of paying for a
# second full 11-check matrix that nobody reads. Pushes to main fall back
# to `run_id`, which is unique per run, so a main run never queues behind
# or cancels another and every commit on the default branch keeps its own
# full run.
#
# Keyed on the number rather than `head_ref`: a branch name is not unique
# across forks, and GitHub's web editor defaults every one of them to
# `patch-1`, so two outside contributors would have cancelled each other's
# runs (#850).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    # Cheap gate so every other job runs only when the paths it guards
    # actually moved. Job-level `if` rather than a workflow-level `paths`
    # filter: a filtered workflow never reports, which blocks a merge the
    # moment any of these is made a required check. A skipped job reports.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      specs: ${{ steps.filter.outputs.specs }}
      schema: ${{ steps.filter.outputs.schema }}
      shell: ${{ steps.filter.outputs.shell }}
      vscode: ${{ steps.filter.outputs.vscode }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          all_on() {
            for k in go specs schema shell vscode jetbrains; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
          }

          # Pushes to main always run in full. The default branch is what
          # releases are cut from, so it does not trade coverage for minutes.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push to main, running everything"
            all_on
            exit 0
          fi

          # Merge base, not the base tip: another PR's code landing on main
          # must not read as this PR's work (same reasoning as the plugin job).
          base=$(git merge-base "$BASE" "$HEAD")
          changed=$(git diff --name-only "$base" "$HEAD")

          if [ -z "$changed" ]; then
            echo "no changed files resolved, running everything"
            all_on
            exit 0
          fi

          echo "changed files:"; echo "$changed"

          # A change to CI itself runs the whole suite. Narrowing the very
          # thing under test is how a broken gate ships green.
          if printf '%s\n' "$changed" | grep -q '^\.github/workflows/'; then
            echo "workflow changed, running everything"
            all_on
            exit 0
          fi

          has() { printf '%s\n' "$changed" | grep -qE "$1"; }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "  $1=$2"; }

          # Go covers the binary and everything asserted against it.
          # tests/, testdata/ and **/fixtures/ are code whatever the
          # extension: a golden .md is an assertion, and 14 of 25 targets
          # have a golden tree and no round-trip test, so that tree is
          # their only guard.
          if has '\.go$' || has '^go\.(mod|sum)$' \
            || has '(^|/)testdata/' || has '^tests/' || has '(^|/)fixtures/' \
            || has '^\.golangci\.yml$' || has '^(Makefile|Taskfile\.yml)$'; then
            go=true
          else
            go=false
          fi

          has '^\.agnostic-ai/' && specs=true || specs=false
          has '^(internal/config/|cmd/schemagen/|docs/schemas/)' && schema=true || schema=false
          has '^(scripts/|.*\.sh$|.*\.bash$)' && shell=true || shell=false
          has '^editors/vscode/' && vscode=true || vscode=false
          has '^editors/jetbrains/' && jetbrains=true || jetbrains=false

          echo "decisions:"
          out go "$go"
          # The spec linter is a Go program, so Go changes re-run it.
          out specs "$([ "$specs" = true ] || [ "$go" = true ] && echo true || echo false)"
          out schema "$([ "$schema" = true ] || [ "$go" = true ] && echo true || echo false)"
          # make test-shell depends on build, so it exercises the binary.
          out shell "$([ "$shell" = true ] || [ "$go" = true ] && echo true || echo false)"
          out vscode "$vscode"
          out jetbrains "$jetbrains"

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build WASM playground
        run: GOOS=js GOARCH=wasm go build -o /tmp/agnostic-ai.wasm ./cmd/agnostic-ai-wasm

  schema:
    name: Schema drift
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate schema
        run: go run ./cmd/schemagen

      - name: Fail on drift
        run: git diff --exit-code docs/schemas/config.schema.json

  speclint:
    name: Spec lint
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    # Runs against this repo's own specs under .agnostic-ai/. Note there is no
    # `sync --check` counterpart: the managed .gitignore block deliberately
    # leaves emitted output uncommitted, so a fresh checkout has nothing to
    # compare against. Source specs are committed, so lint works here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Lint specs
        run: ./agnostic-ai lint

  plugin:
    name: Plugin version bump
    # The marketplace pins the plugin to plugin.json's version, so an edit that
    # ships without a bump never reaches anyone who already installed it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version bumped when the plugin changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          manifest=plugins/agnostic-ai/.claude-plugin/plugin.json
          # Compare against the merge base, not the base tip: another PR's
          # plugin change landing on main must not read as this PR's work.
          BASE=$(git merge-base "$BASE" "$HEAD")
          changed=$(git diff --name-only "$BASE" "$HEAD" -- plugins/ .claude-plugin/)
          if [ -z "$changed" ]; then
            echo "plugin untouched, nothing to check"
            exit 0
          fi
          echo "changed:"; echo "$changed"
          before=$(git show "$BASE:$manifest" 2>/dev/null | grep '"version"' || true)
          after=$(grep '"version"' "$manifest")
          if [ "$before" = "$after" ]; then
            echo "error: plugin files changed but $manifest version is still $after" >&2
            echo "Bump it, or installed users keep the old copy." >&2
            exit 1
          fi
          echo "version moved: ${before:-<none>} -> $after"

  shell:
    name: Shell tests
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bashunit
        run: |
          curl -sSL https://bashunit.typeddevs.com/install.sh | bash -s -- /usr/local/bin

      - name: Run shell tests
        run: make test-shell

  vscode:
    name: VS Code extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci || npm install --no-audit --no-fund

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --skip-license --no-dependencies

  jetbrains:
    name: JetBrains plugin
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            editors/jetbrains/.gradle
          key: gradle-${{ hashFiles('editors/jetbrains/**/*.gradle*', 'editors/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

name: Vendor watch

# Fetches every target's vendor docs and reports the pages whose text moved
# since the last target audit, on one rolling issue labeled `vendor-watch`.
# No AI and no API key: `scripts/docfetch.sh` is curl plus hashing against
# `scripts/target-audit/sources.lock`, and the issue says which targets to
# run `/target-audit` on. The lock is never written here (#1119).

on:
  schedule:
    # 05:43 UTC daily, after CI's 04:17 run. An odd minute keeps it off the hour.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Vendor docs watch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fetched text keyed by its hash, carried between runs so the issue
      # can label each moved page against the text the lock names. Content-
      # addressed, so a stale cache is only a miss ("no-snapshot").
      - name: Restore page snapshots
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/snapshots
          key: docfetch-snapshots-${{ github.run_id }}
          restore-keys: docfetch-snapshots-

      # A changed page whose URL served that exact text on an earlier run is
      # a stale copy or an alternating render, not news (#1167).
      - name: List known pages
        env:
          DOCFETCH_SNAPSHOTS: ${{ runner.temp }}/snapshots
        run: bash -c 'source scripts/vendor-watch.sh && vendor_watch_seen "$DOCFETCH_SNAPSHOTS"' >"$RUNNER_TEMP/known-pages"

      - name: Fetch vendor pages
        env:
          GH_TOKEN: ${{ github.token }}
          DOCFETCH_SNAPSHOTS: ${{ runner.temp }}/snapshots
        run: scripts/docfetch.sh --out "$RUNNER_TEMP/watch" | tail -n 1

      - name: Publish moved pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/vendor-watch.sh publish "$RUNNER_TEMP/watch/docfetch.tsv" "$RUNNER_TEMP/known-pages"

      # Only after a successful publish: a page recorded but never reported
      # would stay quiet on the next run.
      - name: Record fetched pages
        env:
          DOCFETCH_SNAPSHOTS: ${{ runner.temp }}/snapshots
        run: |
          [ -r "$RUNNER_TEMP/watch/docfetch.tsv" ] || exit 0
          bash -c 'source scripts/vendor-watch.sh && vendor_watch_record "$RUNNER_TEMP/watch/docfetch.tsv" "$DOCFETCH_SNAPSHOTS"'

      # Drop what the lock does not name after 30 days, then keep the rest.
      # mkdir: a fetch that died early still leaves a path for the cache step.
      - name: Prune page snapshots
        if: always()
        env:
          DOCFETCH_SNAPSHOTS: ${{ runner.temp }}/snapshots
        run: mkdir -p "$DOCFETCH_SNAPSHOTS" && bash -c 'source scripts/docfetch.sh && snapshot_prune'

      - name: Cache page snapshots
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/snapshots
          key: docfetch-snapshots-${{ github.run_id }}

      # Measurement for #1127, after the issue is published and allowed to
      # fail: a second fetch that also saves each scraped page's .md copy.
      # Download two days' artifacts and run
      # `scripts/docfetch.sh --compare-mirrors <day1>/mirrors <day2>/mirrors`.
      - name: Measure Markdown mirrors
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          DOCFETCH_TIMEOUT: "10"
        run: scripts/docfetch.sh --mirrors --out "$RUNNER_TEMP/mirrors" | tail -n 1

      # After the report, and on every outcome: a failed upload must not cost
      # the issue its report, and a failed fetch still leaves pages to diff.
      - name: Keep the fetched pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-watch-pages
          path: |
            ${{ runner.temp }}/watch
            ${{ runner.temp }}/mirrors
          retention-days: 14

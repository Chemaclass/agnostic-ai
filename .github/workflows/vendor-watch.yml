name: Vendor watch

# Fetches every target's vendor docs and reports the pages whose text moved
# since the last target audit, on one rolling issue labeled `vendor-watch`.
# No AI and no API key: `scripts/docfetch.sh` is curl plus hashing against
# `scripts/target-audit/sources.lock`, and the issue says which targets to
# run `/target-audit` on. The lock is never written here (#1119).

on:
  schedule:
    # 05:43 UTC daily, after CI's 04:17 run. An odd minute keeps it off the hour.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Vendor docs watch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --mirrors also saves each scraped page's .md copy, for the #1127
      # measurement: download two days' artifacts and run
      # `scripts/docfetch.sh --compare-mirrors <day1> <day2>`. It never
      # touches docfetch.tsv, so the issue below is unaffected.
      - name: Fetch vendor pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/docfetch.sh --mirrors --out "$RUNNER_TEMP/watch" | tail -n 1

      - name: Publish moved pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/vendor-watch.sh publish "$RUNNER_TEMP/watch/docfetch.tsv"

      # After the report, and on every outcome: a failed upload must not cost
      # the issue its report, and a failed fetch still leaves pages to diff.
      - name: Keep the fetched pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-watch-pages
          path: ${{ runner.temp }}/watch
          retention-days: 14

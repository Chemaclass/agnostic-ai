name: npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Test the audit policy
        run: node --test scripts/npm-audit.test.mjs

      - name: Audit every tracked npm lockfile
        run: node scripts/npm-audit.mjs

name: Install scripts

# The installers download a published release, so they can break without any
# code change here (asset rename, checksum layout, PATH behavior). Run them on
# every edit and weekly against whatever the latest release is.
on:
  push:
    branches: [main]
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'npm/**', '.github/workflows/install.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'npm/**', '.github/workflows/install.yml']
  schedule:
    - cron: '0 6 * * 1'
  # A release is the moment the published artifacts change, so it is the
  # moment worth checking them. The `published` job below absorbs the
  # registry lag that follows a publish.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install to a temp dir
        run: AGNOSTIC_AI_INSTALL_DIR="$RUNNER_TEMP/bin" bash scripts/install.sh

      # Block scalar: a plain YAML value cannot start with a quote.
      - name: Binary runs
        run: |
          "$RUNNER_TEMP/bin/agnostic-ai" --version

      - name: Piped install works (curl ... | bash)
        run: cat scripts/install.sh | AGNOSTIC_AI_INSTALL_DIR="$RUNNER_TEMP/piped" bash

  windows:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # powershell, not pwsh: 5.1 is what ships with Windows and what most
      # users will pipe this script into.
      - name: Install to a temp dir
        shell: powershell
        run: .\scripts\install.ps1 -InstallDir "$env:RUNNER_TEMP\agnostic-ai"

      # Block scalar: `&` starts a YAML anchor, so the call operator needs one.
      - name: Binary runs
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\agnostic-ai\agnostic-ai.exe" --version

      - name: Second run is idempotent
        shell: powershell
        run: .\scripts\install.ps1 -InstallDir "$env:RUNNER_TEMP\agnostic-ai"

  npm:
    name: npm wrapper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Unit tests
        working-directory: npm
        run: node lib/download_test.js

      - name: Pack
        working-directory: npm
        run: npm pack --pack-destination .

      # npm 11 blocks unapproved install scripts by default, so the lazy path
      # is the one most users hit: install with scripts off, then prove the bin
      # shim fetches the binary on first run.
      - name: Install with scripts blocked
        working-directory: npm
        run: npm install -g --ignore-scripts ./agnostic-ai-0.0.0-dev.tgz

      - name: Binary runs anyway (shim fetches it)
        run: agnostic-ai --version

      - name: Reinstall with the postinstall hook allowed
        working-directory: npm
        run: |
          npm uninstall -g agnostic-ai
          npm install -g ./agnostic-ai-0.0.0-dev.tgz

      - name: Binary runs from the postinstall download
        run: agnostic-ai --version

  published:
    name: published package (${{ matrix.os }})
    # The `npm` job above packs the working tree, and a packed tree carries
    # the 0.0.0-dev placeholder, which sends resolveVersion down its "fall
    # back to the latest release" branch. A published package carries a real
    # version and takes the package.json branch instead, so the path every
    # user hits had no coverage at all (#937).
    #
    # Only this repository publishes agnostic-ai, and a release that failed
    # published nothing worth waiting for.
    if: |
      github.repository == 'Chemaclass/agnostic-ai'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Wait for the registry to serve the latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          want=$(gh release view --repo Chemaclass/agnostic-ai --json tagName --jq '.tagName')
          want="${want#v}"
          # Same bounded backoff as release.yml's distribution guard, for the
          # same reason: a run triggered by a release races the registry
          # replica, and that lag is not a publish failure (#937).
          delay=5
          for attempt in 1 2 3 4 5 6; do
            got=$(npm view "agnostic-ai@${want}" version 2>/dev/null || true)
            echo "attempt $attempt: release=$want npm=${got:-<absent>}"
            if [ "$got" = "$want" ]; then
              echo "version=$want" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::npm does not serve agnostic-ai@${want}; the published package is behind the latest release"
          exit 1

      - name: Install the published package
        run: npm install -g agnostic-ai@${{ steps.release.outputs.version }}

      - name: Binary reports the published version
        shell: bash
        run: |
          set -euo pipefail
          got=$(agnostic-ai --version)
          echo "$got"
          grep -qF "${{ steps.release.outputs.version }}" <<<"$got"

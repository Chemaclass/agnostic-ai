name: Install scripts

# The installers download a published release, so they can break without any
# code change here (asset rename, checksum layout, PATH behavior). Run them on
# every edit and weekly against whatever the latest release is.
on:
  push:
    branches: [main]
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'npm/**', '.github/workflows/install.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'npm/**', '.github/workflows/install.yml']
  schedule:
    - cron: '0 6 * * 1'
  # A release is the moment the published artifacts change, so it is the
  # moment worth checking them. The `published` job below absorbs the
  # registry lag that follows a publish.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install to a temp dir
        run: AGNOSTIC_AI_INSTALL_DIR="$RUNNER_TEMP/bin" bash scripts/install.sh

      # Block scalar: a plain YAML value cannot start with a quote.
      - name: Binary runs
        run: |
          "$RUNNER_TEMP/bin/agnostic-ai" --version

      - name: Piped install works (curl ... | bash)
        run: cat scripts/install.sh | AGNOSTIC_AI_INSTALL_DIR="$RUNNER_TEMP/piped" bash

  windows:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # powershell, not pwsh: 5.1 is what ships with Windows and what most
      # users will pipe this script into.
      - name: Install to a temp dir
        shell: powershell
        run: .\scripts\install.ps1 -InstallDir "$env:RUNNER_TEMP\agnostic-ai"

      # Block scalar: `&` starts a YAML anchor, so the call operator needs one.
      - name: Binary runs
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\agnostic-ai\agnostic-ai.exe" --version

      - name: Second run is idempotent
        shell: powershell
        run: .\scripts\install.ps1 -InstallDir "$env:RUNNER_TEMP\agnostic-ai"

  npm:
    name: npm wrapper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Unit tests
        working-directory: npm
        run: |
          node lib/platforms_test.js
          node scripts/build-platform-packages_test.js

      # The whole install path a user takes, minus the registry: build the six
      # binaries, generate the six platform packages, pack all seven, and
      # install the parent plus this machine's platform package from the
      # tarballs. Nothing here needs a published release.
      - name: Packages resolve and the binary runs
        shell: bash
        run: scripts/npm-smoke.sh

      # The reason the postinstall download is gone. npm 11 prompts before
      # running install scripts and plenty of organizations block them
      # outright; with the binary in a platform package there is nothing to
      # block.
      - name: The same install works with scripts blocked
        shell: bash
        run: NPM_CONFIG_IGNORE_SCRIPTS=true scripts/npm-smoke.sh

  published:
    name: published package (${{ matrix.os }})
    # The `npm` job above resolves the platform packages from local tarballs
    # it just built. Only an install from the registry proves the published
    # parent pins names and versions that exist there, which is the failure
    # a partial publish leaves behind (#942).
    #
    # Only this repository publishes agnostic-ai. After a failed release the
    # wait below would burn its whole window on three runners to rediscover
    # what release.yml's distribution guard already reported.
    if: |
      github.repository == 'Chemaclass/agnostic-ai'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Wait for the registry to serve the latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          want=$(gh release view --repo Chemaclass/agnostic-ai --json tagName --jq '.tagName')
          want="${want#v}"
          # Same bounded backoff as release.yml's distribution guard, for the
          # same reason: a run triggered by a release races the registry
          # replica, and that lag is not a publish failure (#937).
          delay=5
          for attempt in 1 2 3 4 5 6; do
            got=$(npm view "agnostic-ai@${want}" version 2>/dev/null || true)
            echo "attempt $attempt: release=$want npm=${got:-<absent>}"
            if [ "$got" = "$want" ]; then
              echo "version=$want" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::npm does not serve agnostic-ai@${want}; the published package is behind the latest release"
          exit 1

      - name: Install the published package
        run: npm install -g agnostic-ai@${{ steps.release.outputs.version }}

      - name: Binary reports the published version
        shell: bash
        run: |
          set -euo pipefail
          got=$(agnostic-ai --version)
          echo "$got"
          grep -qF "${{ steps.release.outputs.version }}" <<<"$got"

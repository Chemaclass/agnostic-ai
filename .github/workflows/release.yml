name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution channel to resume for the selected release tag
        type: choice
        required: true
        options: [npm, homebrew, scoop, winget]

# Read-only by default; each job that writes asks for it.
permissions:
  contents: read

jobs:
  ui-bundle:
    name: Bundled client
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Check the bundled client against its sources
        run: |
          npm --prefix ui ci --ignore-scripts
          npm --prefix ui run bundle:check

  companion:
    name: macOS companion
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.archives.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: companion/go.mod
          cache: false

      - name: Build the companion archives
        id: package
        continue-on-error: ${{ contains(github.ref_name, '-') }}
        run: scripts/companion-release.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/companion-dist"

      - name: Hand the archives to the signing job
        id: archives
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: companion-built-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/companion-dist/agnostic-ai-companion_darwin_*.tar.gz
            ${{ runner.temp }}/companion-dist/agnostic-ai-companion_darwin_*.dmg
          if-no-files-found: error
          retention-days: 1

  # Signs the disk images with the project certificate, so macOS keeps the
  # app's Accessibility access across releases. The key stays out of the
  # build job, which fetches and runs dependency code; this job runs only
  # this repository's script. See docs/internal/companion-signing.md.
  companion-sign:
    name: Sign the macOS companion
    needs: companion
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.archives.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the built archives
        if: needs.companion.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.companion.outputs.artifact }}
          path: ${{ runner.temp }}/companion-dist

      - name: Sign the disk images
        id: sign
        if: needs.companion.outputs.artifact != ''
        continue-on-error: ${{ contains(github.ref_name, '-') }}
        env:
          COMPANION_SIGNING_P12: ${{ secrets.COMPANION_SIGNING_P12 }}
        run: scripts/companion-sign.sh "$RUNNER_TEMP/companion-dist"

      - name: Hand the archives to GoReleaser
        id: archives
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: companion-dist-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/companion-dist/agnostic-ai-companion_darwin_*.tar.gz
            ${{ runner.temp }}/companion-dist/agnostic-ai-companion_darwin_*.dmg
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: Build release candidate
    needs: [ui-bundle, companion, companion-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/NOTES.md"

      - name: Download the companion archives
        if: needs.companion-sign.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.companion-sign.outputs.artifact }}
          path: ${{ runner.temp }}/companion-dist

      - name: Report a prerelease without the companion archives
        if: needs.companion-sign.outputs.artifact == ''
        run: echo "::notice::companion build or signing failed. Prereleases can ship without macOS companion files."

      - name: Install Syft for the SBOMs
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.1
          args: release --skip=publish --clean --release-notes=${{ runner.temp }}/NOTES.md
        env:
          COMPANION_DIST: ${{ runner.temp }}/companion-dist
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage and validate the release inventory
        run: |
          python3 scripts/release-assets.py stage "$GITHUB_REF_NAME" dist "$RUNNER_TEMP/companion-dist" "$RUNNER_TEMP/candidate"

      - name: Hand the candidate to the smoke and signing jobs
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  ui-smoke:
    name: Archived web interface
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Download the staged candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.goreleaser.outputs.artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Verify the archived web interface
        run: |
          archive_dir="$(mktemp -d)"
          tar -xzf "$RUNNER_TEMP/candidate/assets/agnostic-ai_linux_amd64.tar.gz" -C "$archive_dir" agnostic-ai
          node scripts/ui-smoke.js "$archive_dir/agnostic-ai"

  attest:
    name: Attest the verified candidate
    needs: [goreleaser, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.signed.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the smoke-tested candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.goreleaser.outputs.artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Prepare the attestation subjects
        run: python3 scripts/release-assets.py subjects "$GITHUB_REF_NAME" "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/subjects.txt"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

      - name: Add the portable provenance bundle
        id: bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/candidate/assets/agnostic-ai.intoto.jsonl"
          echo "digest=$(sha256sum "$BUNDLE" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Retain the signed candidate
        id: signed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-candidate-${{ steps.bundle.outputs.digest }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    name: Publish the verified release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    outputs:
      artifact: ${{ needs.attest.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the signed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Publish the checked bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-assets.py inventory "$GITHUB_REF_NAME" "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/assets.txt"
          scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md "$GITHUB_REPOSITORY" "$RUNNER_TEMP/assets.txt" > "$RUNNER_TEMP/NOTES.md"
          python3 scripts/release-assets.py publish "$GITHUB_REF_NAME" "$RUNNER_TEMP/candidate" "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$RUNNER_TEMP/NOTES.md"

  recovery:
    name: Verify recovery inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact: ${{ steps.candidate.outputs.artifact }}
      run-id: ${{ steps.candidate.outputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Find the original release for the tag
        id: candidate
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Select the published version tag, for example gh workflow run release.yml --ref vX.Y.Z -f channel=npm"
            exit 1
          fi
          python3 scripts/release-assets.py recover "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$CHANNEL" >> "$GITHUB_OUTPUT"

  channel-manifests:
    name: Publish ${{ matrix.channel }} manifest
    needs: [publish, recovery]
    if: >-
      ${{ !cancelled() && github.repository == 'Chemaclass/agnostic-ai' &&
          (needs.publish.result == 'success' ||
           (needs.recovery.result == 'success' && inputs.channel != 'npm')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'push' && '["homebrew","scoop","winget"]' || format('["{0}"]', inputs.channel)) }}
    env:
      HOMEBREW_TAP_APP_CONFIGURED: ${{ secrets.HOMEBREW_TAP_APP_ID != '' && secrets.HOMEBREW_TAP_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the signed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact || needs.recovery.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.recovery.outputs.run-id || github.run_id }}

      - name: Mint the Homebrew tap token from the GitHub App
        id: tap_token
        if: matrix.channel == 'homebrew' && env.HOMEBREW_TAP_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: Chemaclass
          repositories: homebrew-tap
          permission-contents: write

      - name: Verify the manifest bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          python3 scripts/release-assets.py verify-channel "$GITHUB_REF_NAME" "$RUNNER_TEMP/candidate" "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$CHANNEL"

      - name: Publish the channel manifest
        env:
          CHANNEL: ${{ matrix.channel }}
          GH_TOKEN: ${{ (matrix.channel == 'homebrew' && (steps.tap_token.outputs.token || secrets.HOMEBREW_TAP_TOKEN)) || (matrix.channel == 'scoop' && secrets.SCOOP_BUCKET_TOKEN) || (matrix.channel == 'winget' && secrets.WINGET_TOKEN) || '' }}
        run: |
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "$CHANNEL: skipped. Configure its credential to publish directly." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/release-channel.py "$CHANNEL" "$GITHUB_REF_NAME" "$RUNNER_TEMP/candidate/channels" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  npm:
    name: npm
    needs: [publish, recovery]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (needs.recovery.result == 'success' && inputs.channel == 'npm')) }}
    concurrency:
      group: npm-release-${{ github.repository }}
      queue: max
    runs-on: ubuntu-latest
    # id-token lets npm mint the short-lived OIDC token that a provenance
    # attestation is signed against. It works alongside the existing token
    # auth; trusted publishing is a separate, owner-side change (#937).
    permissions:
      contents: read
      id-token: write
      # Read the build provenance each archive must carry before it is packed.
      attestations: read
    env:
      NPM_TOKEN_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify and install the npm publishing toolchain
        if: env.NPM_TOKEN_CONFIGURED == 'true'
        run: bash scripts/npm-toolchain.sh

      # Both steps run without NPM_TOKEN too. A fork then proves the generator
      # still works, which is the part of this job nothing else exercises.
      #
      # Collecting the binaries is also the gate on the release being
      # complete: the script downloads all six archives, verifies them against
      # checksums.txt and the provenance this workflow signed for the tag, and
      # refuses a partial set, so a missing or swapped asset stops the publish
      # here.
      - name: Collect the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/npm-binaries.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/npm-binaries" "$(git rev-parse HEAD)"

      - name: Build the platform packages
        run: |
          set -euo pipefail
          node npm/scripts/build-platform-packages.js \
            --binaries "${RUNNER_TEMP}/npm-binaries" \
            --version "${GITHUB_REF_NAME#v}"
          cat npm/package.json

      - name: Publish
        id: publish
        # Skipped until NPM_TOKEN exists, so a release never fails over it.
        # setup-node replaces an empty NODE_AUTH_TOKEN with a placeholder, so
        # test the secret-presence flag captured before setup instead.
        if: env.NPM_TOKEN_CONFIGURED == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/npm-publish.sh "${GITHUB_REF_NAME#v}"

      - name: Report npm status
        if: ${{ !cancelled() }}
        env:
          PUBLISH_STATE: ${{ steps.publish.outputs.state }}
        run: |
          case "$NPM_TOKEN_CONFIGURED:$PUBLISH_STATE" in
            false:*) message="skipped. Configure NPM_TOKEN to publish." ;;
            true:verified) message="verified. All seven packages and their provenance are available." ;;
            true:superseded) message="verified for $GITHUB_REF_NAME. A newer version keeps its distribution tag." ;;
            *) message="failed. Inspect the job and resume npm for $GITHUB_REF_NAME." ;;
          esac
          echo "npm: $message" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$NPM_TOKEN_CONFIGURED" = true ]; then
            [ "$PUBLISH_STATE" = verified ] || [ "$PUBLISH_STATE" = superseded ]
          fi

  distribution:
    name: Homebrew availability
    needs: [publish, recovery, channel-manifests]
    if: >-
      ${{ !cancelled() && github.repository == 'Chemaclass/agnostic-ai' &&
          (needs.publish.result == 'success' ||
           (needs.recovery.result == 'success' && inputs.channel == 'homebrew')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Homebrew cask serves this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_CONFIGURED: ${{ (secrets.HOMEBREW_TAP_APP_ID != '' && secrets.HOMEBREW_TAP_APP_PRIVATE_KEY != '') || secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          attempts=1
          if [ "$TAP_CONFIGURED" = true ]; then attempts=6; fi
          delay=5
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            result=$(python3 scripts/release-channel.py homebrew "$GITHUB_REF_NAME" --check 2>&1) || true
            echo "$result"
            case "$result" in
              "homebrew: verified."*|"homebrew: superseded."*|"homebrew: skipped."*)
                echo "$result" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
            esac
            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          if [ "$TAP_CONFIGURED" != true ]; then
            echo "::notice::Homebrew availability is pending. The tap updates on its own schedule."
            echo "homebrew: pending. Dispatch the tap's Update agnostic-ai cask workflow to check sooner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Homebrew did not verify after $attempts attempts"
          echo "homebrew: failed. Inspect the tap and resume homebrew for $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          exit 1

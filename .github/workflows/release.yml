name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md "${GITHUB_REPOSITORY}" > NOTES.md
          echo "--- NOTES.md ---"
          cat NOTES.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Both optional: the matching publisher builds its manifest and skips
          # the push when its secret is absent, so the release still succeeds.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  npm:
    name: npm
    # The wrapper downloads release assets on install, so it can only publish
    # once GoReleaser has uploaded them. It runs even when the GoReleaser job
    # failed: assets upload before the Homebrew, Scoop, and winget pushes, so
    # a package-manager token going stale must not also hold back npm. The
    # asset check below is the real gate, rather than the job result.
    needs: goreleaser
    if: always() && needs.goreleaser.result != 'cancelled' && needs.goreleaser.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TOKEN_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Require the release archives the wrapper downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          echo "$assets"
          for want in \
            agnostic-ai_darwin_amd64.tar.gz agnostic-ai_darwin_arm64.tar.gz \
            agnostic-ai_linux_amd64.tar.gz agnostic-ai_linux_arm64.tar.gz \
            agnostic-ai_windows_amd64.zip agnostic-ai_windows_arm64.zip \
            checksums.txt; do
            if ! grep -qx "$want" <<<"$assets"; then
              echo "::error::release ${GITHUB_REF_NAME} is missing $want; not publishing to npm"
              exit 1
            fi
          done

      - name: Version the package from the tag
        working-directory: npm
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Skip when this version is already on the registry
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # `npm view` exits non-zero for a package that has never been
          # published, which is the first-release case, not an error.
          if npm view "agnostic-ai@${version}" version >/dev/null 2>&1; then
            echo "::notice::agnostic-ai@${version} is already published; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # Skipped until NPM_TOKEN exists, so a release never fails over it.
        # setup-node replaces an empty NODE_AUTH_TOKEN with a placeholder, so
        # test the secret-presence flag captured before setup instead.
        if: env.NPM_TOKEN_CONFIGURED == 'true' && steps.published.outputs.exists == 'false'
        working-directory: npm
        run: npm publish --access public

      - name: Report skipped publish
        if: env.NPM_TOKEN_CONFIGURED != 'true'
        run: echo "::notice::NPM_TOKEN is not configured; skipping npm publish"

  distribution:
    name: Distribution channels
    # Every package-manager push in this pipeline is skipped when its token
    # is absent, by design, so a fork or a local run still releases. That
    # also means a token going empty is indistinguishable from a fork build
    # in the goreleaser log, and the release still reports success. It hid a
    # stale Homebrew cask for ten releases (#920).
    #
    # This job is the check nobody had: ask each published channel what
    # version it actually serves and compare it against the tag.
    needs: [goreleaser, npm]
    if: always() && github.repository == 'Chemaclass/agnostic-ai' && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Homebrew cask serves this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_CONFIGURED: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          if [ "$TAP_CONFIGURED" != "true" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is empty, so the cask was never pushed and brew still serves the previous release. Set the secret and re-run."
            exit 0
          fi
          cask=$(gh api repos/Chemaclass/homebrew-tap/contents/Casks/agnostic-ai.rb \
            --jq '.content' | base64 -d)
          got=$(grep -m1 -oE 'version "[^"]+"' <<<"$cask" | cut -d'"' -f2)
          echo "tag=$want cask=$got"
          if [ "$got" != "$want" ]; then
            echo "::error::the tap serves agnostic-ai $got but this release is $want; the cask push did not land"
            exit 1
          fi

      - name: npm serves this tag
        env:
          NPM_TOKEN_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          if [ "$NPM_TOKEN_CONFIGURED" != "true" ]; then
            echo "::warning::NPM_TOKEN is empty, so nothing was published to npm. Set the secret and re-run."
            exit 0
          fi
          got=$(npm view "agnostic-ai@${want}" version 2>/dev/null || true)
          echo "tag=$want npm=${got:-<absent>}"
          if [ "$got" != "$want" ]; then
            echo "::error::npm does not serve agnostic-ai@${want}; the publish did not land"
            exit 1
          fi

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step `if:`, so record the
    # App's presence here, where it is. The mint step below calls
    # `core.setFailed` when its identifier or its key is empty, which would
    # fail the whole release over a credential that does not exist yet, and
    # no missing credential is allowed to do that in this workflow.
    env:
      HOMEBREW_TAP_APP_CONFIGURED: ${{ secrets.HOMEBREW_TAP_APP_ID != '' && secrets.HOMEBREW_TAP_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md "${GITHUB_REPOSITORY}" > NOTES.md
          echo "--- NOTES.md ---"
          cat NOTES.md

      - name: Mint the Homebrew tap token from the GitHub App
        id: tap_token
        # Skipped until the App exists, so a release never fails over it,
        # and skipped on every fork, which cannot read the secrets anyway.
        # A skipped step leaves its outputs empty, which is what the
        # fallback below reads.
        if: env.HOMEBREW_TAP_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # v3 deprecated `app-id` in favor of `client-id`, but the action
          # sends whichever is set as the JWT issuer and GitHub accepts the
          # App ID there. #943 stores the App ID, so name that input.
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          # Without these the token is scoped to this repository, which is
          # not the one the cask is pushed to. Naming the tap alone also
          # bounds a leak to it, which a classic PAT with `repo` never did.
          owner: Chemaclass
          repositories: homebrew-tap
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An installation token that expires in an hour when the App is
          # set up, the stored PAT while it is not, and empty when neither
          # exists, which is the case goreleaser skips the cask push on. The
          # App's private key does not expire, so once it is in place there
          # is nothing left to rotate (#943).
          HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          # Both optional: the matching publisher builds its manifest and skips
          # the push when its secret is absent, so the release still succeeds.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  npm:
    name: npm
    # The platform packages carry the release binaries, so this job can only
    # run once GoReleaser has uploaded them. It runs even when the GoReleaser
    # job failed: assets upload before the Homebrew, Scoop, and winget pushes,
    # so a package-manager token going stale must not also hold back npm.
    # scripts/npm-binaries.sh is the real gate, rather than the job result: it
    # fails when an archive is missing or does not match its checksum.
    needs: goreleaser
    if: always() && needs.goreleaser.result != 'cancelled' && needs.goreleaser.result != 'skipped'
    runs-on: ubuntu-latest
    # id-token lets npm mint the short-lived OIDC token that a provenance
    # attestation is signed against. It works alongside the existing token
    # auth; trusted publishing is a separate, owner-side change (#937).
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TOKEN_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
      # npm documents 9.5.0 as the floor for --provenance, which Node 22's
      # bundled npm 10.x already clears. Pin anyway so the version that signs
      # a release is the one we chose, not whatever setup-node happens to
      # bundle, and pick 11.5.1 because that is npm's floor for trusted
      # publishing, the next step on this package.
      NPM_CLI_VERSION: '11.5.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin the npm CLI that publishes
        # Only the publish needs it, and setup-node leaves a placeholder auth
        # token in .npmrc when NPM_TOKEN is absent, which a registry read can
        # reject. Gate the step the same way the publish is gated so a fork
        # never fails here over a credential it does not have.
        if: env.NPM_TOKEN_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_CLI_VERSION}"
          npm --version

      # Both steps run without NPM_TOKEN too. A fork then proves the generator
      # still works, which is the part of this job nothing else exercises.
      #
      # Collecting the binaries is also the gate on the release being
      # complete: the script downloads all six archives, verifies them against
      # checksums.txt, and refuses a partial set, so a missing asset stops the
      # publish here.
      - name: Collect the release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/npm-binaries.sh "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/npm-binaries"

      - name: Build the platform packages
        run: |
          set -euo pipefail
          node npm/scripts/build-platform-packages.js \
            --binaries "${RUNNER_TEMP}/npm-binaries" \
            --version "${GITHUB_REF_NAME#v}"
          cat npm/package.json

      - name: Publish
        # Skipped until NPM_TOKEN exists, so a release never fails over it.
        # setup-node replaces an empty NODE_AUTH_TOKEN with a placeholder, so
        # test the secret-presence flag captured before setup instead.
        if: env.NPM_TOKEN_CONFIGURED == 'true'
        run: scripts/npm-publish.sh "${GITHUB_REF_NAME#v}"

      - name: Report skipped publish
        if: env.NPM_TOKEN_CONFIGURED != 'true'
        run: echo "::notice::NPM_TOKEN is not configured; skipping npm publish"

  distribution:
    name: Distribution channels
    # Every package-manager push in this pipeline is skipped when its token
    # is absent, by design, so a fork or a local run still releases. That
    # also means a token going empty is indistinguishable from a fork build
    # in the goreleaser log, and the release still reports success. It hid a
    # stale Homebrew cask for ten releases (#920).
    #
    # This job is the check nobody had: ask each published channel what
    # version it actually serves and compare it against the tag.
    needs: [goreleaser, npm]
    if: always() && github.repository == 'Chemaclass/agnostic-ai' && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Both checks below read a replica that lags the write they verify. On
      # v0.62.0 `npm view` answered `<absent>` nine seconds after a publish
      # that had landed, and the identical job two minutes later answered
      # with the tag (#937). A red check that is sometimes wrong trains you
      # to dismiss it, so each check retries with bounded exponential backoff
      # (5s, 10s, 20s, 40s, 80s, about 2.5 minutes in total). Only the "not
      # there yet" case retries: an absent token still warns and exits 0, and
      # a channel still stale at the end of the window is still an error.
      - name: Homebrew cask serves this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Either credential pushes the cask: the App mints a token per run
          # and the PAT is the fallback until the App exists (#943). Only
          # when both are absent was there no push to verify.
          TAP_CONFIGURED: ${{ (secrets.HOMEBREW_TAP_APP_ID != '' && secrets.HOMEBREW_TAP_APP_PRIVATE_KEY != '') || secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          if [ "$TAP_CONFIGURED" != "true" ]; then
            echo "::notice::no tap credential here, which is expected. Chemaclass/homebrew-tap updates its own cask on a half-hourly schedule with its own GITHUB_TOKEN, so brew catches up within the hour and this repository holds no secret for it. Run that repository's 'Update agnostic-ai cask' workflow to pull it forward."
            exit 0
          fi
          delay=5
          for attempt in 1 2 3 4 5 6; do
            # no-cache because the contents API is served through a cache
            # that can still hold the pre-push tree.
            cask=$(gh api repos/Chemaclass/homebrew-tap/contents/Casks/agnostic-ai.rb \
              -H 'Cache-Control: no-cache' --jq '.content' 2>/dev/null | base64 -d || true)
            got=$(grep -m1 -oE 'version "[^"]+"' <<<"$cask" | cut -d'"' -f2 || true)
            echo "attempt $attempt: tag=$want cask=${got:-<absent>}"
            if [ "$got" = "$want" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "::error::the tap serves agnostic-ai ${got:-<absent>} but this release is $want; the cask push did not land"
          exit 1

      # Seven packages now, not one. The parent pins exact versions of the six
      # platform packages, so a parent that published while one of them did
      # not leaves `npm install` broken on that platform until the next
      # release, with the registry reporting the release as fine.
      #
      # Each package is checked twice: the version exists, and the dist-tag
      # this version was meant to publish under resolves to it. Version
      # alone is not enough. An untagged `npm publish` writes `latest`, so a
      # prerelease could land correctly at its version while silently
      # replacing the stable release every unpinned `npm install agnostic-ai`
      # resolves, and a version-only guard would report that as a success.
      - name: npm serves this tag
        env:
          NPM_TOKEN_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          if [ "$NPM_TOKEN_CONFIGURED" != "true" ]; then
            echo "::warning::NPM_TOKEN is empty, so nothing was published to npm. Set the secret and re-run."
            exit 0
          fi
          # Sourced, not restated: the publish step derives the tag from the
          # same helper, so the guard cannot assert a tag nobody published.
          # shellcheck source=scripts/npm-publish.sh
          . scripts/npm-publish.sh
          dist_tag="$(npm_dist_tag "$want")"
          echo "expecting dist-tag $dist_tag to resolve to $want"
          missing=0
          # Read the names from the table the packages are generated from,
          # rather than repeating them here. A list that drifts from
          # npm/lib/platforms.js checks six packages nobody publishes and
          # passes while the six that exist go unverified.
          # Unquoted on purpose: split the newline-separated list into words.
          # No package name contains a space. mapfile would be tidier and is
          # bash 4, which macOS does not ship, so this stays runnable anywhere.
          pkgs=$(cd npm && node -p "
            const t = require('./lib/platforms.js')
            t.PLATFORMS.map(t.packageName).join('\n')
          ")
          # shellcheck disable=SC2086
          for pkg in agnostic-ai $pkgs; do
            delay=5
            found=""
            for attempt in 1 2 3 4 5 6; do
              got=$(npm view "${pkg}@${want}" version 2>/dev/null || true)
              tagged=$(npm view "${pkg}@${dist_tag}" version 2>/dev/null || true)
              echo "attempt $attempt: $pkg tag=$want npm=${got:-<absent>} ${dist_tag}=${tagged:-<absent>}"
              if [ "$got" = "$want" ] && [ "$tagged" = "$want" ]; then
                found=yes
                break
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            if [ -z "$found" ]; then
              if [ "$got" = "$want" ]; then
                echo "::error::npm serves ${pkg}@${want} but its ${dist_tag} dist-tag points at ${tagged:-<absent>}"
              else
                echo "::error::npm does not serve ${pkg}@${want}"
              fi
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the npm release is incomplete; installs break on any platform whose package is missing, and an unpinned install resolves whatever ${dist_tag} still points at"
            exit 1
          fi

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>agnostic-ai</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/bubble.css">
  <script type="module" src="/bubble.js"></script>
</head>
<body>
  <button class="bubble" id="bubble" type="button" aria-label="Conversations">
    <span class="ring" aria-hidden="true"></span>
    <span class="disc" aria-hidden="true">
      <!-- The focused grid mark, as in docs/site/static/favicon.svg. -->
      <svg class="mark" viewBox="0 0 64 64" focusable="false">
        <g class="dots">
          <circle cx="14" cy="14" r="4.5"/><circle cx="32" cy="14" r="4.5"/><circle cx="50" cy="14" r="4.5"/>
          <circle cx="14" cy="32" r="4.5"/><circle cx="50" cy="32" r="4.5"/>
          <circle cx="14" cy="50" r="4.5"/><circle cx="32" cy="50" r="4.5"/><circle cx="50" cy="50" r="4.5"/>
        </g>
        <circle class="focus-dot" cx="32" cy="32" r="4.5"/>
        <circle class="focus-ring" cx="32" cy="32" r="10"/>
      </svg>
    </span>
    <span class="badge" id="badge" hidden></span>
  </button>
</body>
</html>

# agnostic-ai project config
#
# This repo dogfoods the tool: source specs live under .agnostic-ai/
# and `agnostic-ai sync` regenerates the per-CLI configs in the working tree.
#
# Generated outputs (CLAUDE.md, AGENTS.md, .cursor/, etc.) stay in .gitignore.

version: 1

# Source directories, relative to this file.
sources:
  agents: .agnostic-ai/agents
  skills: .agnostic-ai/skills
  rules: .agnostic-ai/rules
  hooks: .agnostic-ai/hooks
  commands: .agnostic-ai/commands
  mcps: .agnostic-ai/mcps

# AI CLIs to emit configs for. Every adapter the tool ships is enabled
# so the project itself acts as the end-to-end fixture for each emitter.
# Comment any out to skip.
#
# Note: codex, amp, and warp all default to root `AGENTS.md` per the
# community AGENTS.md spec. Only one can own the root file in a project,
# so the dogfood set keeps codex (which also emits .codex/config.toml)
# and drops amp and warp. Real users pick the one matching their CLI.
# `sync` now fails fast with an output-collision error if more than one
# is enabled without an `outputs.<target>.file` override.
targets:
  - claude
  - codex
  - gemini
  - cursor
  - copilot
  - aider
  - cline
  - windsurf
  - continue
  - zed
  - opencode
  # antigravity: Google Antigravity IDE (.agent/rules/*.md + .agent/AGENTS.md).
  # Preview product; MCP and skills support to follow once the upstream spec stabilises.
  - antigravity

# Per-target output overrides. Defaults work for everything below;
# the aider conf-file is opt-in and demonstrates the merge feature.
outputs:
  aider:
    file: CONVENTIONS.md
    conf-file: .aider.conf.yml

# What to do when a target does not support a spec kind.
on-unsupported: warn   # warn | error | silent

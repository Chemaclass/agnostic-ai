# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.100.0/docs/schemas/config.schema.json
# agnostic-ai project config
#
# This repo dogfoods the tool: source specs live under .agnostic-ai/
# and `agnostic-ai sync` regenerates the per-CLI configs in the working tree.
#
# Generated outputs (CLAUDE.md, AGENTS.md, .claude/, etc.) stay in .gitignore,
# except the cloud setup files and the root AGENTS.md and CLAUDE.md, which
# cloud agents read from a clone (see .gitignore).

version: 1
requires: ">=0.100.0"
builtins: [cloud-handoff, handoff, memory]

# Use default source directories under .agnostic-ai/.
# Sync only the tools maintainers use. Adapter and integration tests
# cover every target with their own configs, not this file.
targets:
  - claude
  - codex

outputs:
  codex:
    # Inline glob-scoped rules in the root AGENTS.md. Codex nested files
    # cannot express file filters such as **/*.go, so they load always.
    nested-glob-rules: false

# What to do when a target does not support a spec kind.
on-unsupported: warn   # warn | error | silent

sync:
  unmanaged:
    - tests/integration/fixtures/scope-union/
    - tests/integration/fixtures/rule-heading-context/
    - tests/integration/fixtures/codex-glob-context/
    - tests/integration/fixtures/windsurf-nested-globs/


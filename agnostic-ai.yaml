# agnostic-ai project config
#
# This repo dogfoods the tool: source specs live under .agnostic-ai/
# and `agnostic-ai sync` regenerates the per-CLI configs in the working tree.
#
# Generated outputs (CLAUDE.md, AGENTS.md, .cursor/, etc.) stay in .gitignore.

version: 1

# Source directories default to `.agnostic-ai/{agents,skills,rules,hooks,
# mcps,commands}` relative to this file, so the `sources:` block is omitted.
# Set it only to point a kind somewhere else.

# AI CLIs to emit configs for. Every adapter the tool ships is enabled,
# so this repo is the end-to-end fixture for each emitter. Comment any
# out to skip.
#
# codex, amp, warp, zed, cline, junie, kiro, crush, and trae all read the
# root `AGENTS.md`. Sync writes it once: the byte-identical pointer body
# (plus the shared inline rules block) deduplicates across them, so they
# coexist with no collision. Only divergent content at the same path
# errors, which an `outputs.<target>.file` override would resolve.
targets:
  - claude
  - codex
  - gemini
  - cursor
  - copilot
  - aider
  - cline
  - windsurf
  - continue
  - zed
  - opencode
  # antigravity: Google Antigravity IDE (.agent/rules/*.md + .agent/AGENTS.md).
  # Preview product; MCP and skills support to follow once the upstream spec stabilises.
  - antigravity
  - junie
  - kiro
  - crush
  - trae
  - amp
  - warp

# Per-target output overrides. Defaults work for everything below;
# the aider conf-file is opt-in and demonstrates the merge feature.
#
# The remaining keys close the "soft gaps" sync reports as `note:` lines.
# Each kind below is declared-supported by the adapter but only emits
# behind one of these output keys; without it the content stays
# source-dir only.
outputs:
  aider:
    file: CONVENTIONS.md
    conf-file: .aider.conf.yml
    # Fold agents and skills into the concatenated CONVENTIONS.md
    # (legacy rules-file layout). Without this they never reach aider.
    rules-file: CONVENTIONS.md
  gemini:
    # Emit skills as slash commands under .gemini/commands/.
    emit-skills-as-commands: true
  opencode:
    # Emit skills as commands under .opencode/command/.
    emit-skills-as-commands: true
  zed:
    # Render hooks as on-demand Zed Tasks (Zed has no hook surface).
    tasks-file: .zed/tasks.json

# What to do when a target does not support a spec kind.
on-unsupported: warn   # warn | error | silent

# Lefthook git hooks. Install with: `lefthook install`
# https://lefthook.dev/

pre-commit:
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -l {staged_files} | (! grep .)
      fail_text: "Run `gofmt -w` on the listed files."

commit-msg:
  commands:
    conventional-commits:
      run: |
        subject=$(head -n 1 "{1}")
        printf '%s\n' "$subject" | grep -qE '^(feat|fix|docs|ref|test|chore|perf|build|ci|revert)(\([a-z0-9-]+\))?!?: .+$' \
          && test "${#subject}" -le 72 \
          || (echo "Subject must follow Conventional Commits and be under 72 chars." && exit 1)

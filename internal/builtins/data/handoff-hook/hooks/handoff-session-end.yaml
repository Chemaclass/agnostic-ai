      for (i = 1; i <= 4; i++) v = v * 16 + index("0123456789abcdef", tolower(substr(h, i, 1))) - 1
      return v
    }
    function codepoint(h, low) {
      if (h == 0) { string_nul = 1; return "?" }
      if (h >= 55296 && h <= 56319) {

name: handoff-session-end
description: Save Git state when a session ends.
targets: [claude, codex, gemini, qoder, factory]
event: SessionEnd
shell: bash
command: |
  echo '
  handoff_resolve_root() {
    handoff_root=$(pwd -P) || return 1
    handoff_global=${AGNOSTIC_AI_HOME:-${HOME-}/.agnostic-ai}
    handoff_global=$(cd "$handoff_global" 2>/dev/null && pwd -P) || handoff_global=
    handoff_cursor=$handoff_root
    while :; do
      if [ "$handoff_cursor" != "$handoff_global" ] &&
         { [ -f "$handoff_cursor/agnostic-ai.yaml" ] ||
           [ -f "$handoff_cursor/agnostic.config.yaml" ]; }; then
        handoff_root=$handoff_cursor
        return 0
      fi
      handoff_parent=$(dirname "$handoff_cursor") || return 1
      [ "$handoff_parent" = "$handoff_cursor" ] && break
      handoff_cursor=$handoff_parent
    done
    handoff_root=$(git rev-parse --show-toplevel) || return 1
  }
  handoff_cleanup() {
    if [ -n "${handoff_temp-}" ]; then
      rm -f "$handoff_temp" >/dev/null 2>&1
    fi
  }
  handoff_reply() {
    if [ "$handoff_tool" != factory ]; then
      printf "%s
  " "{}"
    fi
  }
  handoff_stop() {
    handoff_cleanup
    handoff_reply
    exit 0
  }
  handoff_branch_slug() {
    LC_ALL=C awk -v branch="$handoff_branch" -f - <<"HANDOFF_SLUG"
  BEGIN {
    for (n = 128; n < 256; n++) byte[sprintf("%c", n)] = n
    for (i = 1; i <= length(branch); i++) {
      c = substr(branch, i, 1)
      if (c ~ /^[A-Za-z0-9._-]$/) printf "%s", c
      else {
        printf "-"
        n = byte[c]
        if (n >= 192 && n < 224) i++
        else if (n >= 224 && n < 240) i += 2
        else if (n >= 240 && n < 248) i += 3
      }
    }
  }
  HANDOFF_SLUG
  }
  handoff_write_snapshot() {
    handoff_path=$1
    handoff_owner=$3
    handoff_parent=$(dirname "$handoff_path") || return 1
    handoff_existing=$handoff_parent
    while [ ! -d "$handoff_existing" ]; do
      handoff_next=$(dirname "$handoff_existing" && printf ".") || return 1
      handoff_next=${handoff_next%?}
      handoff_next=${handoff_next%?}
      [ "$handoff_next" != "$handoff_existing" ] || return 1
      handoff_existing=$handoff_next
    done
    handoff_real=$(CDPATH= cd "$handoff_existing" && pwd -P && printf ".") || return 1
    handoff_real=${handoff_real%?}
    handoff_real=${handoff_real%?}
    handoff_path=$handoff_real${handoff_path#"$handoff_existing"}
    handoff_parent=$(dirname "$handoff_path") || return 1
    case "$handoff_path" in
      "${handoff_owner%/}/"*) handoff_relative=${handoff_path#"${handoff_owner%/}/"} ;;
      *) return 1 ;;
    esac
    (CDPATH= cd "$handoff_owner" && git check-ignore -q -- "$handoff_relative") || return 1
    [ ! -L "$handoff_path" ] || return 1
    if [ "$2" = task ] && [ -e "$handoff_path" ]; then
      [ -f "$handoff_path" ] || return 1
      [ "$(sed -n "1{p;q;}" "$handoff_path")" = "# Automatic handoff" ] || return 1
      handoff_header=$(sed -n "2{p;q;}" "$handoff_path") || return 1
      case "$handoff_header" in *" | branch: $handoff_branch | head: "*) ;; *) return 1 ;; esac
    fi
    mkdir -p "$handoff_parent" || return 1
    handoff_temp=$(mktemp "$handoff_path.XXXXXX") || return 1
    handoff_detached=" | detached: false"
    [ "$handoff_branch_status" -ne 1 ] || handoff_detached=" | detached: true"
    if ! (CDPATH= cd "$handoff_owner" && git check-ignore -q -- "${handoff_temp#"${handoff_owner%/}/"}") ||
       ! printf "# Automatic handoff
  tool: %s | date: %s | branch: %s | head: %s
  worktree: %s%s

  ## Git status

  %s

  ## Last five commits

  %s
  " "$handoff_tool" "$handoff_date" "$handoff_branch" "$handoff_head" "$handoff_worktree" "$handoff_detached" "$handoff_status" "$handoff_commits" >"$handoff_temp" ||
       ! chmod 600 "$handoff_temp" ||
       ! mv -f "$handoff_temp" "$handoff_path"; then
      handoff_cleanup
      handoff_temp=
      return 1
    fi
    handoff_temp=
  }
  handoff_snapshot() {
    handoff_resolve_root || return 1
    cd "$handoff_root" || return 1
    handoff_inside=$(git rev-parse --is-inside-work-tree) || return 1
    [ "$handoff_inside" = true ] || return 1
    handoff_head=$(git rev-parse HEAD) || return 1
    handoff_branch=$(git symbolic-ref --quiet --short HEAD)
    handoff_branch_status=$?
    case "$handoff_branch_status" in
      0) ;;
      1) handoff_branch=detached ;;
      *) return 1 ;;
    esac
    handoff_date=$(date -u "+%Y-%m-%dT%H:%M:%SZ") || return 1
    handoff_status=$(git status --short) || return 1
    handoff_commits=$(git -c log.showSignature=false --no-pager log -5 --format=%s) || return 1
    case "$handoff_tool" in
      claude|codex|gemini|qoder|factory) ;;
      *) return 1 ;;
    esac
    umask 077
    trap handoff_cleanup 0
    trap handoff_stop HUP INT TERM
    handoff_checkout=$(git rev-parse --show-toplevel && printf ".") || return 1
    handoff_checkout=${handoff_checkout%?}
    handoff_checkout=${handoff_checkout%?}
    handoff_worktree=$handoff_checkout
    handoff_checkout=$(cd "$handoff_checkout" && pwd -P && printf ".") || return 1
    handoff_checkout=${handoff_checkout%?}
    handoff_checkout=${handoff_checkout%?}
    handoff_slug=$(handoff_branch_slug) || return 1
    [ "$handoff_branch_status" -ne 1 ] || handoff_slug=detached-$handoff_head
    handoff_main=$(git -c core.quotePath=false worktree list --porcelain | sed -n "1s/^worktree //p")
    handoff_shared_done=false
    if [ -n "$handoff_main" ] && [ "$(CDPATH= cd "$handoff_main" && git rev-parse --is-bare-repository)" = false ]; then
      if handoff_main=$(cd "$handoff_main" && pwd -P); then
        handoff_suffix=${handoff_root#"$handoff_checkout"}
        if handoff_write_snapshot "$handoff_main$handoff_suffix/.agnostic-ai/local/handoffs/$handoff_slug.auto.md" task "$handoff_main"; then
          handoff_shared_done=true
        fi
      fi
    fi
    handoff_dir=$handoff_root/.agnostic-ai/local
    if [ "$handoff_shared_done" != true ]; then
      handoff_write_snapshot "$handoff_dir/handoffs/$handoff_slug.auto.md" task "$handoff_checkout"
    fi
    handoff_write_snapshot "$handoff_dir/HANDOFF.auto.md" legacy "$handoff_checkout"
  }
  handoff_tool=${1:-${AGNOSTIC_AI_TARGET-}}
  handoff_snapshot "$@" </dev/null 2>/dev/null
  handoff_reply
  exit 0
  #' | sh -c "read -r handoff_transport; exec sh -s"; exit 0

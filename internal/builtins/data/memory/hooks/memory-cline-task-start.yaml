name: memory-cline-task-start
description: Load the shared memory index when a Cline VS Code task starts.
event: TaskStart
targets: [cline]
command: "sh -c 'd=$(pwd); until [ -x \"$d/node_modules/.bin/agnostic-ai\" ] || [ -f \"$d/agnostic-ai.yaml\" ] || [ -f \"$d/agnostic.config.yaml\" ] || [ \"$d\" = \"$(dirname \"$d\")\" ]; do d=$(dirname \"$d\"); done; bin=\"$d/node_modules/.bin/agnostic-ai\"; [ -x \"$bin\" ] || bin=agnostic-ai; command -v \"$bin\" >/dev/null || exit 0; AGNOSTIC_AI_NO_UPDATE_CHECK=1 \"$bin\" project --help >/dev/null 2>&1 || { echo \"agnostic-ai: this version has no project command; upgrade to 0.83.0 or newer\" >&2; exit 1; }; exec \"$bin\" project -- hook memory --target cline'"
commandWindows: "$d = (Get-Location).Path; $bin = 'agnostic-ai'; while ($d) { $local = Join-Path $d 'node_modules/.bin/agnostic-ai.cmd'; if (Test-Path -LiteralPath $local) { $bin = $local; break }; if ((Test-Path -LiteralPath (Join-Path $d 'agnostic-ai.yaml')) -or (Test-Path -LiteralPath (Join-Path $d 'agnostic.config.yaml'))) { break }; $parent = Split-Path -Parent $d; if ($parent -eq $d) { break }; $d = $parent }; if ($bin -eq 'agnostic-ai' -and !(Get-Command agnostic-ai -ErrorAction SilentlyContinue)) { exit 0 }; $env:AGNOSTIC_AI_NO_UPDATE_CHECK = '1'; & $bin project --help *> $null; if ($LASTEXITCODE -ne 0) { [Console]::Error.WriteLine('agnostic-ai: this version has no project command; upgrade to 0.83.0 or newer'); exit 1 }; & $bin project -- hook memory --target cline; exit $LASTEXITCODE"
x-cline:
  runtime: vscode

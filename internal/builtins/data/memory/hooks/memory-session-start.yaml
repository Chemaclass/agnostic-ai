name: memory-session-start
description: Load the shared memory index into the session.
on: session-start
targets: [codex, copilot, cursor, gemini, qoder, factory]
command: "sh -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || root=\"$PWD\"; if [ -x \"$root/node_modules/.bin/agnostic-ai\" ]; then exec \"$root/node_modules/.bin/agnostic-ai\" project -- hook memory --target codex; fi; command -v agnostic-ai >/dev/null 2>&1 || exit 0; exec agnostic-ai project -- hook memory --target codex'"
commandWindows: "$root = (Get-Location).Path; if (Get-Command git -ErrorAction SilentlyContinue) { $top = git rev-parse --show-toplevel 2>$null; if ($top) { $root = $top } }; $local = Join-Path $root 'node_modules/.bin/agnostic-ai.cmd'; if (Test-Path $local) { & $local project -- hook memory --target codex } elseif (Get-Command agnostic-ai -ErrorAction SilentlyContinue) { agnostic-ai project -- hook memory --target codex }"
x-codex:
  command: "sh -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || root=\"$PWD\"; if [ -x \"$root/node_modules/.bin/agnostic-ai\" ]; then exec \"$root/node_modules/.bin/agnostic-ai\" project -- hook memory --target codex; fi; command -v agnostic-ai >/dev/null 2>&1 || exit 0; exec agnostic-ai project -- hook memory --target codex'"
x-copilot:
  command: "sh -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || root=\"$PWD\"; if [ -x \"$root/node_modules/.bin/agnostic-ai\" ]; then exec \"$root/node_modules/.bin/agnostic-ai\" project -- hook memory --target copilot; fi; command -v agnostic-ai >/dev/null 2>&1 || exit 0; exec agnostic-ai project -- hook memory --target copilot'"
  commandWindows: "$root = (Get-Location).Path; if (Get-Command git -ErrorAction SilentlyContinue) { $top = git rev-parse --show-toplevel 2>$null; if ($top) { $root = $top } }; $local = Join-Path $root 'node_modules/.bin/agnostic-ai.cmd'; if (Test-Path $local) { & $local project -- hook memory --target copilot } elseif (Get-Command agnostic-ai -ErrorAction SilentlyContinue) { agnostic-ai project -- hook memory --target copilot }"
x-cursor:
  command: "sh -c 'root=\"${CURSOR_PROJECT_DIR:-}\"; if [ -z \"$root\" ]; then root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || root=\"$PWD\"; fi; if [ -x \"$root/node_modules/.bin/agnostic-ai\" ]; then exec \"$root/node_modules/.bin/agnostic-ai\" project -- hook memory --target cursor; fi; command -v agnostic-ai >/dev/null 2>&1 || exit 0; exec agnostic-ai project -- hook memory --target cursor'"

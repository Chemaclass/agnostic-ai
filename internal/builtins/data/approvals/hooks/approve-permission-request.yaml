name: approve-permission-request
description: Answer a permission prompt by the approvals setting; print nothing to leave the prompt.
targets: [claude, codex, kiro, qwen, qoder]
event: PermissionRequest
timeout: 10
command: "command -v agnostic-ai >/dev/null 2>&1 || exit 0; AGNOSTIC_AI_NO_UPDATE_CHECK=1 agnostic-ai hook approve --target claude 2>/dev/null; exit 0"
x-codex:
  command: "command -v agnostic-ai >/dev/null 2>&1 || exit 0; AGNOSTIC_AI_NO_UPDATE_CHECK=1 agnostic-ai hook approve --target codex 2>/dev/null; exit 0"
x-qoder:
  command: "command -v agnostic-ai >/dev/null 2>&1 || exit 0; AGNOSTIC_AI_NO_UPDATE_CHECK=1 agnostic-ai hook approve --target qoder 2>/dev/null; exit 0"
x-qwen:
  command: "command -v agnostic-ai >/dev/null 2>&1 || exit 0; AGNOSTIC_AI_NO_UPDATE_CHECK=1 agnostic-ai hook approve --target qwen 2>/dev/null; exit 0"
x-kiro:
  action:
    type: command
    command: "command -v agnostic-ai >/dev/null 2>&1 || exit 0; AGNOSTIC_AI_NO_UPDATE_CHECK=1 agnostic-ai hook approve --target kiro 2>/dev/null; exit 0"

permissions:
  allow:
    - read
    - edit(src/**)
    - shell(go test:*)
    - shell(git status)
    - shell(git diff:*)
    - mcp:github/get_pull_request
    - mcp:github/list_pull_request_files
    - mcp:github/create_pull_request
    - mcp:railway/deploy
    - mcp:railway/logs
    - mcp:analytics-db/query
  ask:
    - shell(git push:*)
    - mcp:railway/variables
    - mcp:github/merge_pull_request
  deny:
    - shell(rm:*)
    - edit(.env)
    - mcp:railway/delete
    - mcp:analytics-db/execute

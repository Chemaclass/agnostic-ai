{# A poster that links to YouTube until video.js swaps in the player on click,
   so nothing loads from YouTube before the visitor asks. #}
{% component video.poster(video_id, video_title, play_label, poster, loading) %}<div class="demo-frame" data-video-facade data-video-id="{{ video_id }}" data-video-title="{{ video_title }}">
        <a class="demo-poster" href="https://www.youtube.com/watch?v={{ video_id }}" data-video-play aria-label="{{ play_label }}">
          <img src="{{ poster }}" width="1280" height="720" alt="" loading="{{ loading }}" decoding="async">
          <span class="demo-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
        </a>
      </div>{% endcomponent video.poster %}

[hero]
title = "One source."
accent_title = "Every AI coding tool."
body = "Write your project instructions once, in your repository. `agnostic-ai sync` writes the file each tool reads, in its own format."
primary_label = "Set up your project"
secondary_label = "Explore the files"

[hero.fanout]
label = "One source file, synced into the file each coding tool reads"
source = ".agnostic-ai/AGNOSTIC_AI.md"
note = "Run the project tests before finishing a change."
targets = ["claude", "codex", "cursor", "windsurf", "gemini"]
more_label = "more tools"
with_label = "With agnostic-ai"
without_label = "Without"
hand_label = "Edit each file by hand"
with_summary = ["1 file you edit", "Every tool reads the same rule"]
without_summary = ["{n} files you edit by hand", "Rules drift apart"]

[[hero.fanout.outputs]]
path = "CLAUDE.md"
tools = "Claude Code"
drift = "Run the project tests before finishing a change."
[[hero.fanout.outputs]]
path = "AGENTS.md"
tools = "Codex, Cursor, Windsurf"
drift = "Run tests before committing."
[[hero.fanout.outputs]]
path = "GEMINI.md"
tools = "Gemini CLI"
drift = "No rule yet."

[hero.video]
video_id = "oHeKVk6bidA"
video_title = "One setup for every AI coding tool: Claude Code, Codex, Cursor and more"
play_label = "Play the video: one setup for every AI coding tool, 1 minute"
body = "One minute on why every AI coding tool wants its own setup, and how agnostic-ai writes them all from one source."
upload_date = "2026-09-27"
duration = "PT1M"

[mission]
title = "Your setup outlives"
muted_title = "the tool you picked."
body = "Every AI coding tool ships its own config file. Adopt three and your instructions live in three places, drifting apart. agnostic-ai keeps **one source in your repository** and writes the rest."

[[mission.principles]]
title = "You own the source"
body = "Markdown and YAML in your repo. No account, no service."
[[mission.principles]]
title = "Generated files are outputs"
body = "Same input, same bytes. Catch drift in CI with `sync --check`."
[[mission.principles]]
title = "Keep native tool files"
body = "Each tool reads its own files. Sync flags what a tool cannot use."
[[mission.principles]]
title = "A sync layer, not a platform"
body = "Stop any time. The generated files keep working."

[mission.symlinks]
question = "Why not just symlink one file?"
answer = "Each tool reads a different format at a different path. A symlink shares bytes. It cannot translate them."
link_label = "See how the formats diverge"

[workflow]
title = "Start with one note."
muted_title = "Then change it once."
install_label = "All install options"
guide_label = "Follow the setup guide"
migration_label = "Bring an existing setup"

[[workflow.steps]]
title = "Choose your tools"
command = "agnostic-ai init"
body = "Run this in your project. Select Claude Code and Codex for this example, or the tools you use. Accept the import offer to keep existing instructions."
[[workflow.steps]]
title = "Write one project note"
file = ".agnostic-ai/AGNOSTIC_AI.md"
body = "Add a short instruction, such as the test command for your project. This is the source you maintain."
[[workflow.steps]]
title = "Generate and read the files"
command = "agnostic-ai sync"
body = "Preview with `agnostic-ai sync --plan`, then sync. In this example, find your note in `AGENTS.md` and the `@AGENTS.md` reference in `CLAUDE.md`. For other tools, follow their generated files and references."
[[workflow.steps]]
title = "Make your next edit"
command = "agnostic-ai sync"
body = "Change the note in `.agnostic-ai/AGNOSTIC_AI.md`, then sync again. In this example, check the updated note in `AGENTS.md`. Claude Code keeps reading it through the same reference."

[[workflow.installers]]
id = "brew"
tab = "macOS"
label = "Homebrew"
recommend_for = "macos"
recommend_label = "Recommended for macOS"
prompt = "$"
command = "brew install --cask Chemaclass/tap/agnostic-ai"
note = "Homebrew, on macOS or Linux."
[[workflow.installers]]
id = "script"
tab = "Linux"
label = "Script"
recommend_for = "linux"
recommend_label = "Recommended for Linux"
prompt = "$"
command = "curl -fsSL https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.sh | bash"
note = "Also on macOS. Checks the release checksum, then installs to `/usr/local/bin` when writable, otherwise `~/.local/bin`."
[[workflow.installers]]
id = "windows"
tab = "Windows"
label = "Windows"
recommend_for = "windows"
recommend_label = "Recommended for Windows"
prompt = ">"
command = "irm https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.ps1 | iex"
note = "PowerShell on Windows 10 or 11. Installs to `%LOCALAPPDATA%\\Programs\\agnostic-ai` and adds it to `PATH`. Open a new terminal afterwards."
[[workflow.installers]]
id = "npm"
tab = "npm"
label = "npm"
prompt = "$"
command = "npm install -g agnostic-ai"
note = "Node 18 or newer, on any OS."

[explorer]
title = "Share more when you need it."
muted_title = "Explore the source files."
body = "Everything lives in `.agnostic-ai/`, next to `agnostic-ai.yaml`, which picks your targets. Pick an entry to see a source file and the native files `sync` writes from it, each in its own tool's format."
tree_label = "Entries in .agnostic-ai"
root = ".agnostic-ai/"
outputs_label = "sync"
more = "Also `reviews/`, `environments/`, and `ignore/`. See [every spec kind](@/docs/spec-format/_index.md)."

[[explorer.entries]]
id = "instructions"
name = "AGNOSTIC_AI.md"
hint = "project guidance"
file = "AGNOSTIC_AI.md"
selected = true
summary = "Project instructions, written into each tool's root file. Select `rules/` to see where rules land."
outputs = [
  { tool = "Claude Code", path = "CLAUDE.md", part = "instructions" },
  { tool = "Codex", path = "AGENTS.md", part = "instructions" },
  { tool = "Gemini CLI", path = "GEMINI.md", part = "instructions" },
]
href = "@/docs/configuration.md"
anchor = "entry-point-files"
docs_label = "Entry-point files"

[[explorer.entries]]
id = "agents"
name = "agents/"
hint = "delegate work"
file = "agents/test-writer.md"
summary = "Subagents with a role, their tools, and a model per tool."
outputs = [
  { tool = "Claude Code", path = ".claude/agents/test-writer.md" },
  { tool = "Codex", path = ".codex/agents/test-writer.toml", selected = true },
  { tool = "Gemini CLI", path = ".gemini/agents/test-writer.md" },
]
href = "@/docs/spec-format/_index.md"
anchor = "agents"
docs_label = "Agents"

[[explorer.entries]]
id = "commands"
name = "commands/"
hint = "slash prompts"
file = "commands/review.md"
summary = "Saved prompts you run by name, such as `/review`."
outputs = [
  { tool = "Claude Code", path = ".claude/commands/review.md" },
  { tool = "Codex", note = "Codex reads custom prompts only from `~/.codex/prompts`, so sync writes no project file and prints a note. Write the workflow as a skill to reach Codex." },
  { tool = "Gemini CLI", path = ".gemini/commands/review.toml" },
]
href = "@/docs/spec-format/commands.md"
anchor = "write-one"
docs_label = "Commands"

[[explorer.entries]]
id = "hooks"
name = "hooks/"
hint = "tool events"
file = "hooks/format.yaml"
summary = "Commands that run on tool events. Write `on: after-edit` once, and sync writes the event and edit tool names each tool uses."
outputs = [
  { tool = "Claude Code", path = ".claude/settings.json" },
  { tool = "Codex", path = ".codex/hooks.json" },
  { tool = "Gemini CLI", path = ".gemini/settings.json" },
]
href = "@/docs/spec-format/hooks.md"
anchor = "hooks"

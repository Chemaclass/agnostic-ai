[[hero.diagram.outputs]]
id = "claude"
label = "Claude Code"
path = ".claude/agents/reviewer.md"
note = "Markdown with YAML frontmatter. The per-target model map resolves to `model: claude-opus-5-5`, `effort` keeps its name, and the three tools pass through as written."
body = '''

[hero]
title = "One setup"
accent_title = "Every AI CLI"
body = "Keep agents, skills, rules, hooks, and MCP servers in **one portable source**. agnostic-ai writes each tool's native files and checks them for drift."
primary_label = "Install and start"
secondary_label = "Try in the browser"
facts = "25 targets. 10 portable spec kinds. Byte-stable output."
install_label = "Recommended installer"
install_link_label = "All install options"

[hero.diagram]
source_name = ".agnostic-ai/rules/commits.md"
source = """---
name: conventional-commits
globs: \"**/*\"
---
Use Conventional Commits."""
outputs = [
  "CLAUDE.md",
  ".cursor/rules/commits.mdc",
  "GEMINI.md · AGENTS.md",
  ".junie/AGENTS.md · .kiro/steering · +13",
]

[mission]
title = "Your setup outlives"
muted_title = "the tool you picked."
body = "Every AI coding tool ships its own config file. Adopt three and your instructions live in three places, drifting apart. That is lock-in, one config file at a time. agnostic-ai keeps **one source in your repository** and writes the rest."

[[mission.principles]]
title = "You own the source"
body = "Plain Markdown and YAML in your repo. No account, no database, no service. `import` brings an existing setup in without rewriting it."
[[mission.principles]]
title = "Generated files are outputs"
body = "Never a second source of truth. Same input, same bytes, so they diff cleanly. `sync --check` fails CI when they drift."
[[mission.principles]]
title = "No tool is privileged"
body = "Adding a target never changes what the others get. `rules/backend/auth.md` routes to each target's native directory and scope syntax."
[[mission.principles]]
title = "A sync layer, not a platform"
body = "agnostic-ai should be easy to stop using. The generated files are yours and they keep working."

[targets]
title = "One source of truth,"
muted_title = "every tool native."
body = "The five most complete integrations. **Native** writes that spec kind by default, **opt-in** you turn on."
features = ["agent", "skill", "rule", "hook", "mcp", "command"]
ids = ["claude", "codex", "cursor", "gemini", "copilot"]
link_label = "See paths and all 25 targets"

[workflow]
title = "Three commands."
muted_title = "Import, preview, sync."
install_label = "All install options"
guide_label = "Open the getting started guide"
migration_label = "Migrate an existing setup"

[[workflow.steps]]
title = "Start or import"
command = "agnostic-ai init --from all"
body = "Import existing AI tool files first."
[[workflow.steps]]
title = "Review the output"
command = "agnostic-ai sync --dry-run"
body = "Preview every native file before writing it."
[[workflow.steps]]
title = "Write the files"
command = "agnostic-ai sync"
body = "Write every native file for the targets you chose."

[[workflow.installers]]
id = "brew"
label = "Homebrew"
recommend_for = "macos"
recommend_label = "Recommended for macOS"
prompt = "$"
command = "brew install --cask Chemaclass/tap/agnostic-ai"
note = "macOS. Upgrade with `brew update && brew upgrade --cask Chemaclass/tap/agnostic-ai`."
[[workflow.installers]]
id = "windows"
label = "Windows"
recommend_for = "windows"
recommend_label = "Recommended for Windows"
prompt = ">"
command = "irm https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.ps1 | iex"
note = "Windows 10 and 11, in PowerShell. The script selects your CPU archive, checks it, and adds the binary to `PATH`."
[[workflow.installers]]
id = "script"
label = "Script"
recommend_for = "linux"
recommend_label = "Recommended for Linux"
prompt = "$"
command = "curl -fsSL https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.sh | bash"
note = "No package manager or Go required. The script selects the archive for your OS and CPU, verifies it, and installs the binary."
[[workflow.installers]]
id = "go"
label = "Go"
prompt = "$"
command = "go install github.com/chemaclass/agnostic-ai/cmd/agnostic-ai@latest"
note = "Any platform with Go 1.24+. Make sure `$(go env GOPATH)/bin` is on your `PATH`."
[[workflow.installers]]
id = "binary"
label = "Binary"
prompt = "$"
command = "curl -sSL https://github.com/Chemaclass/agnostic-ai/releases/latest/download/agnostic-ai_darwin_arm64.tar.gz | tar xz"
note = "Swap `darwin_arm64` for your release archive. Windows builds and `checksums.txt` are on the releases page."

[demo]
title = "Watch it run."
muted_title = "The talk demo."
body = "Twenty minutes from one spec to native files for every target."

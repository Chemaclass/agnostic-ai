[hero]
title = "One spec."
accent_title = "Every AI CLI."
body = "You write `CLAUDE.md`, then `.cursor/rules`, then `GEMINI.md`, then `AGENTS.md`. The same content in four formats. Switch tools and you rewrite everything. agnostic-ai keeps **one source of truth** and emits each tool's native config, byte-stable across runs."
primary_label = "Try the playground"
secondary_label = "See how it works"
facts = "25 supported targets. 20 enabled by default. One source of truth."

[hero.diagram]
source_name = ".agnostic-ai/rules/commits.md"
source = """---
name: conventional-commits
globs: \"**/*\"
---
Use Conventional Commits."""
outputs = [
  "CLAUDE.md",
  ".cursor/rules/commits.mdc",
  "GEMINI.md · AGENTS.md",
  ".junie/AGENTS.md · .kiro/steering · +13",
]

[problem]
title = "Same content,"
muted_title = "N formats, endless drift."
body = "Every AI coding tool invented its own config file. The instructions are identical. Only the wrapper differs. Copy and paste keeps them in sync until it doesn't, and a stale `GEMINI.md` is a silent bug."

[[problem.columns]]
title = "Without agnostic-ai"
tone = "bad"
items = [
  "Write the same rule into `CLAUDE.md`, `.cursor/rules`, `GEMINI.md`, and `AGENTS.md`.",
  "Edit one, forget the others. They drift apart.",
  "Onboard a new tool and hand-port everything again.",
  "No review check tells you which files fell behind.",
]

[[problem.columns]]
title = "With agnostic-ai"
tone = "good"
items = [
  "Write it **once** in plain Markdown and YAML frontmatter.",
  "Run `sync`. Every tool gets its native format.",
  "Add a tool with one line in `targets`.",
  "`sync --check` fails CI when output drifts.",
]

[targets]
title = "One source of truth,"
muted_title = "25 tools, each native."
body = "Compare ten of the broadest integrations across the configuration surfaces teams use most. **Yes** means one portable agnostic-ai spec reaches a native target surface."
features = ["Rules", "Agents", "Skills", "MCP", "Hooks", "Commands", "Permissions"]
caption = "Coverage counts all 10 portable spec kinds. Permissions means portable allow, deny, and ask settings."
link_label = "See paths and all 25 targets"


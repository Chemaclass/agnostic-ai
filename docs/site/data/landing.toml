docs_label = "MCP servers"

[[explorer.entries]]
id = "overlays"
name = "overlays/"
hint = "native keys"
files = ["overlays/claude.settings.json", "overlays/codex.config.toml"]
summary = "Native keys no spec covers, one file per tool: the Claude Code status line, Codex notification settings. Sync merges each into that tool's own file."
outputs = [
  { tool = "Claude Code", path = ".claude/settings.json" },
  { tool = "Codex", path = ".codex/config.toml" },
  { tool = "Gemini CLI", note = "Gemini CLI has no overlay file. Put its native keys under `x-gemini` in a `settings/` spec, and sync merges them into `.gemini/settings.json`." },
]
href = "@/docs/targets/claude.md"
anchor = "claude-settings"
docs_label = "Claude settings"

[[explorer.entries]]
id = "rules"

'''

[[hero.diagram.outputs]]
id = "cursor"
label = "Cursor"
path = ".cursor/agents/reviewer.md"
note = "`tools` and `effort` are dropped. Sync says why: Cursor subagents have neither field, so use `readonly: true` for a coarse restriction and put effort in the model id, such as `claude-opus-5[effort=high]`."
body = '''

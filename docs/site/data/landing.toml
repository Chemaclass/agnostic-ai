[hero]
title = "One setup"
accent_title = "Every AI CLI"
body = "Keep agents, skills, rules, hooks, and MCP servers in **one portable source**. agnostic-ai writes each tool's native files and checks them for drift."
primary_label = "Install and start"
secondary_label = "Try in the browser"
facts = "25 targets. 10 portable spec kinds. Byte-stable output."
install_label = "Recommended installer"
install_link_label = "All install options"

[hero.video]
video_id = "oHeKVk6bidA"
video_title = "One setup for every AI coding tool: Claude Code, Codex, Cursor and more"
play_label = "Play the video: one setup for every AI coding tool, 1 minute"
body = "One minute on why every AI coding tool wants its own setup, and how agnostic-ai writes them all from one source."
upload_date = "2026-09-27"
duration = "PT1M"

[mission]
title = "Your setup outlives"
muted_title = "the tool you picked."
body = "Every AI coding tool ships its own config file. Adopt three and your instructions live in three places, drifting apart. agnostic-ai keeps **one source in your repository** and writes the rest."

[[mission.principles]]
title = "You own the source"
body = "Plain Markdown and YAML in your repo. No account, no service. `import` brings an existing setup in."
[[mission.principles]]
title = "Generated files are outputs"
body = "Same input, same bytes, so they diff cleanly. `sync --check` fails CI when they drift."
[[mission.principles]]
title = "No tool is privileged"
body = "Adding a target never changes what the others get. One rule routes to every native path and scope syntax."
[[mission.principles]]
title = "A sync layer, not a platform"
body = "Easy to stop using. The generated files are yours, and they keep working."

[mission.symlinks]
question = "Why not just symlink one file?"
answer = "Each tool reads a different format at a different path. A symlink shares bytes. It cannot translate them."
link_label = "See how the formats diverge"

[workflow]
title = "Three commands."
muted_title = "Import, preview, sync."
install_label = "All install options"
guide_label = "Open the getting started guide"
migration_label = "Migrate an existing setup"

[[workflow.steps]]
title = "Start or import"
command = "agnostic-ai init --from all"
body = "Import existing AI tool files first."
[[workflow.steps]]
title = "Review the output"
command = "agnostic-ai sync --dry-run"
body = "Preview every native file before writing it."
[[workflow.steps]]
title = "Write the files"
command = "agnostic-ai sync"
body = "Write every native file for the targets you chose."

[[workflow.installers]]
id = "brew"
tab = "macOS"
label = "Homebrew"
recommend_for = "macos"
recommend_label = "Recommended for macOS"
prompt = "$"
command = "brew install --cask Chemaclass/tap/agnostic-ai"
note = "Homebrew, on macOS or Linux."
[[workflow.installers]]
id = "script"
tab = "Linux"
label = "Script"
recommend_for = "linux"
recommend_label = "Recommended for Linux"
prompt = "$"
command = "curl -fsSL https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.sh | bash"
note = "Also on macOS. Checks the release checksum, then installs to `/usr/local/bin` when writable, otherwise `~/.local/bin`."
[[workflow.installers]]
id = "windows"
tab = "Windows"
label = "Windows"
recommend_for = "windows"
recommend_label = "Recommended for Windows"
prompt = ">"
command = "irm https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.ps1 | iex"
note = "PowerShell on Windows 10 or 11. Installs to `%LOCALAPPDATA%\\Programs\\agnostic-ai` and adds it to `PATH`. Open a new terminal afterwards."
[[workflow.installers]]
id = "npm"
tab = "npm"
label = "npm"
prompt = "$"
command = "npm install -g agnostic-ai"
note = "Node 18 or newer, on any OS. To try it without installing, run `npx agnostic-ai sync`."

[explorer]
title = "Write it once."
muted_title = "Every tool reads it natively."
body = "Everything lives in `.agnostic-ai/`, next to `agnostic-ai.yaml`, which picks your targets. Pick an entry to see a source file and the native files `sync` writes from it, each in its own tool's format."
tree_label = "Entries in .agnostic-ai"
root = ".agnostic-ai/"
outputs_label = "sync"
more = "Also `commands/`, `reviews/`, `environments/`, and `ignore/`. See [every spec kind](@/docs/spec-format/_index.md)."

[[explorer.entries]]
id = "instructions"
name = "AGNOSTIC_AI.md"
hint = "instructions"
file = "AGNOSTIC_AI.md"
summary = "Project instructions. Each tool gets the same body in its own entry file."
outputs = [
  { tool = "Claude Code", path = "CLAUDE.md" },
  { tool = "Codex", path = "AGENTS.md" },
  { tool = "Gemini CLI", path = "GEMINI.md" },
]
href = "@/docs/configuration.md"
anchor = "entry-point-files"
docs_label = "Entry-point files"

[[explorer.entries]]
id = "agents"
name = "agents/"
hint = "subagents"
file = "agents/test-writer.md"
selected = true
summary = "Subagents with a role, their tools, and a model per tool."
outputs = [
  { tool = "Claude Code", path = ".claude/agents/test-writer.md" },
  { tool = "Codex", path = ".codex/agents/test-writer.toml", selected = true },
  { tool = "Gemini CLI", path = ".gemini/agents/test-writer.md" },
]
href = "@/docs/spec-format/_index.md"
anchor = "agents"
docs_label = "Agents"

[[explorer.entries]]
id = "hooks"
name = "hooks/"
hint = "tool events"
file = "hooks/format.yaml"
summary = "Commands that run on tool events, such as after every edit."
outputs = [
  { tool = "Claude Code", path = ".claude/settings.json" },
  { tool = "Codex", path = ".codex/hooks.json" },
]
reach = "Events are written as is. Claude Code and Codex share `PostToolUse`; Gemini CLI names its events its own way, such as `AfterTool`, so it takes a hook spec of its own."
href = "@/docs/spec-format/hooks.md"
anchor = "hooks"
docs_label = "Hooks"

[[explorer.entries]]
id = "local"
name = "local/"
hint = "personal"
file = "local/rules/my-style.md"
summary = "Your own specs on this machine, ignored by Git. Sync layers them over the shared specs."
outputs = [
  { tool = "Claude Code", path = ".claude/rules/my-style.md" },
  { tool = "Codex", path = "AGENTS.md" },
  { tool = "Gemini CLI", path = "GEMINI.md" },
]
href = "@/docs/local-overrides.md"
docs_label = "Local overrides"

[[explorer.entries]]
id = "mcps"
name = "mcps/"
hint = "MCP servers"
file = "mcps/github.yaml"
summary = "MCP server connections, one YAML file per server. Secrets stay in environment variables."
outputs = [
  { tool = "Claude Code", path = ".mcp.json" },
  { tool = "Codex", path = ".codex/config.toml" },
  { tool = "Gemini CLI", path = ".gemini/settings.json" },
]
href = "@/docs/spec-format/mcps.md"
anchor = "mcp-servers"
docs_label = "MCP servers"

[[explorer.entries]]
id = "overlays"
name = "overlays/"
hint = "native keys"
files = ["overlays/claude.settings.json", "overlays/codex.config.toml"]
summary = "Native keys no spec covers, one file per tool: the Claude Code status line, Codex notifications and profiles. Sync merges each into that tool's own file."
outputs = [
  { tool = "Claude Code", path = ".claude/settings.json" },
  { tool = "Codex", path = ".codex/config.toml" },
]
href = "@/docs/targets/claude.md"
anchor = "claude-settings"
docs_label = "Claude settings"

[[explorer.entries]]
id = "rules"
name = "rules/"
hint = "conventions"
file = "rules/testing.md"
summary = "Conventions, always on or tied to file patterns and folders."
outputs = [
  { tool = "Claude Code", path = ".claude/rules/testing.md" },
  { tool = "Codex", path = "AGENTS.md" },
  { tool = "Gemini CLI", path = "GEMINI.md" },
]
href = "@/docs/spec-format/skills.md"
anchor = "rules"
docs_label = "Rules"

[[explorer.entries]]
id = "scripts"
name = "scripts/"
hint = "hook scripts"
file = "scripts/claude/format.sh"
summary = "Hook script bodies. Sync copies each one into the hooks folder of every tool the hook targets."
outputs = [
  { tool = "Claude Code", path = ".claude/hooks/format.sh" },
  { tool = "Codex", path = ".codex/hooks/format.sh" },
]
href = "@/docs/spec-format/hooks.md"
anchor = "hooks"
docs_label = "Hooks"

[[explorer.entries]]
id = "settings"
name = "settings/"
hint = "permissions"
files = ["settings/model.yaml", "settings/permissions.yaml"]
summary = "The default model and effort per tool, and permissions."
outputs = [
  { tool = "Claude Code", path = ".claude/settings.json" },
  { tool = "Codex", path = ".codex/config.toml" },
]
reach = "Codex and Gemini CLI have no portable permission list, and the model map names no Gemini model, so sync prints a note for each instead of guessing."
href = "@/docs/spec-format/settings.md"
anchor = "settings"
docs_label = "Settings"

[[explorer.entries]]
id = "skills"
name = "skills/"
hint = "workflows"
file = "skills/release/SKILL.md"
summary = "Reusable workflows. Files beside `SKILL.md`, such as `check.sh`, copy with it."
outputs = [
  { tool = "Claude Code", path = ".claude/skills/release/SKILL.md" },
  { tool = "Codex", path = ".agents/skills/release/SKILL.md" },
  { tool = "Gemini CLI", path = ".gemini/skills/release/SKILL.md" },
]
href = "@/docs/spec-format/skills.md"
anchor = "skills"
docs_label = "Skills"


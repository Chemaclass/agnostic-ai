[hero]
title = "One source."
accent_title = "Every AI coding tool."
body = "Write your instructions, agents and hooks once, in your repository. One sync writes the file each tool reads, in its own format."
install_label = "For macOS and Linux."
install_others = "Windows, Homebrew or npm"
primary_label = "Get started"
playground_label = "Try it in the browser"

[hero.fanout]
label = "One agent spec, synced into the agent file each coding tool reads"
source_label = "You write"
source = ".agnostic-ai/agents/reviewer.md"
line = "model: fast"
targets = ["claude", "codex", "gemini"]
more_label = "more tools"

[[hero.fanout.outputs]]
path = ".claude/agents/reviewer.md"
tools = "Claude Code"
line = "model: haiku"
[[hero.fanout.outputs]]
path = ".codex/agents/reviewer.toml"
tools = "Codex"
line = 'model = "gpt-6-luna"'
[[hero.fanout.outputs]]
path = ".gemini/agents/reviewer.md"
tools = "Gemini CLI"
line = "model: gemini-3.5"

[workflow]
title = "Three steps."
muted_title = "Then you edit one file."
guide_label = "Read the setup guide"
promises = [
  "Plain files in your repo, no account",
  "Same input, same bytes: check drift in CI",
  "Stop any time, the files keep working",
]

[[workflow.steps]]
title = "Pick your tools"
command = "agnostic-ai init"
body = "Choose Claude Code, Codex, Cursor or any of {n} tools. Existing instructions are imported."
[[workflow.steps]]
title = "Write it once"
file = ".agnostic-ai/AGNOSTIC_AI.md"
body = "Add a project note, such as your test command. This is the only file you maintain."
[[workflow.steps]]
title = "Sync"
command = "agnostic-ai sync"
body = "Every tool you picked reads it. Edit the note, sync again, and they all follow."

[[workflow.installers]]
id = "brew"
tab = "macOS"
label = "Homebrew"
recommend_for = "macos"
detected_label = "Detected macOS."
others_label = "Linux, Windows or npm"
prompt = "$"
command = "brew install --cask Chemaclass/tap/agnostic-ai"
note = "Homebrew, on macOS or Linux."
[[workflow.installers]]
id = "script"
tab = "Linux"
label = "Script"
recommend_for = "linux"
detected_label = "Detected Linux."
others_label = "macOS, Windows or npm"
prompt = "$"
command = "curl -fsSL https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.sh | bash"
note = "Also on macOS. Checks the release checksum, then installs to `/usr/local/bin` when writable, otherwise `~/.local/bin`."
[[workflow.installers]]
id = "windows"
tab = "Windows"
label = "Windows"
recommend_for = "windows"
detected_label = "Detected Windows."
others_label = "macOS, Linux or npm"
prompt = ">"
command = "irm https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.ps1 | iex"
note = "PowerShell on Windows 10 or 11. Installs to `%LOCALAPPDATA%\\Programs\\agnostic-ai` and adds it to `PATH`. Open a new terminal afterwards."
[[workflow.installers]]
id = "npm"
tab = "npm"
label = "npm"
prompt = "$"
command = "npm install -g agnostic-ai"
note = "Node 18 or newer, on any OS."

[explorer]
title = "See what sync writes."
body = "Click a source file, then a tool. The same spec, in each tool's own format and path."
tree_label = "Source files"
root = ".agnostic-ai/"
more_label = "Every spec kind"

[[explorer.entries]]
id = "instructions"
name = "AGNOSTIC_AI.md"
hint = "instructions"
file = "AGNOSTIC_AI.md"
outputs = [
  { tool = "Claude Code", path = "CLAUDE.md", part = "instructions" },
  { tool = "Codex", path = "AGENTS.md", part = "instructions" },
  { tool = "Gemini CLI", path = "GEMINI.md", part = "instructions" },
]

[[explorer.entries]]
id = "rules"
name = "rules/"
hint = "conventions"
file = "rules/testing.md"
outputs = [
  { tool = "Claude Code", path = ".claude/rules/testing.md" },
  { tool = "Codex", path = "AGENTS.md", part = "rule:testing" },
  { tool = "Gemini CLI", path = "GEMINI.md", part = "rule:testing" },
]

[[explorer.entries]]
id = "agents"
name = "agents/"
hint = "subagents"
file = "agents/test-writer.md"
selected = true
outputs = [
  { tool = "Claude Code", path = ".claude/agents/test-writer.md" },
  { tool = "Codex", path = ".codex/agents/test-writer.toml", selected = true },
  { tool = "Gemini CLI", path = ".gemini/agents/test-writer.md" },
]

[[explorer.entries]]
id = "skills"
name = "skills/"
hint = "workflows"
file = "skills/release/SKILL.md"
outputs = [
  { tool = "Claude Code", path = ".claude/skills/release/SKILL.md" },
  { tool = "Codex", path = ".agents/skills/release/agents/openai.yaml" },
  { tool = "Gemini CLI", path = ".gemini/skills/release/SKILL.md" },
]
reach = "Gemini CLI has no setting that keeps a skill for when you ask, so sync drops `disable-model-invocation` there and prints a note."

[[explorer.entries]]
id = "hooks"
name = "hooks/"
hint = "tool events"
file = "hooks/format.yaml"
outputs = [
  { tool = "Claude Code", path = ".claude/settings.json", part = "json:hooks,env" },
  { tool = "Codex", path = ".codex/hooks.json" },
  { tool = "Gemini CLI", path = ".gemini/settings.json", part = "json:hooks" },
]

[updates]
new_label = "New"
links = [
  { label = "Why not a symlink?", href = "@/docs/why-agnostic-ai.md", anchor = "why-the-usual-fixes-fall-short" },
  { label = "Set up with an agent", href = "@/docs/agent-setup.md" },
  { label = "Bring an existing setup", href = "@/docs/migration.md" },
]

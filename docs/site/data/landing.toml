[workflow]
title = "Install, then sync."
muted_title = "Your first portable setup."
body = "Choose an installer, initialize the repository, and verify the generated files. Existing AI configuration can be imported before the first sync."
guide_label = "Open the getting started guide"
migration_label = "Migrate an existing setup"

[[workflow.steps]]
title = "Start or import"
command = "agnostic-ai init --from all"
body = "Detect existing AI tool files and import them before generating anything. For a fresh repository, run `agnostic-ai init`."
[[workflow.steps]]
title = "Review the output"
command = "agnostic-ai sync --dry-run"
body = "Preview every native file before writing it. Choose only the targets this repository uses."
[[workflow.steps]]
title = "Sync and enforce"
command = "agnostic-ai sync && agnostic-ai sync --check"
body = "Write the files, then use the same check in CI to catch drift."

[[workflow.installers]]
id = "brew"
label = "Homebrew"
recommend_for = "macos"
recommend_label = "Recommended for macOS"
prompt = "$"
command = "brew install --cask Chemaclass/tap/agnostic-ai"
note = "macOS. Upgrade with `brew update && brew upgrade --cask Chemaclass/tap/agnostic-ai`."
[[workflow.installers]]
id = "windows"
label = "Windows"
recommend_for = "windows"
recommend_label = "Recommended for Windows"
prompt = ">"
command = "irm https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.ps1 | iex"
note = "Windows 10 and 11, in PowerShell. The script selects your CPU archive, checks it, and adds the binary to `PATH`."
[[workflow.installers]]
id = "script"
label = "Script"
recommend_for = "linux"
recommend_label = "Recommended for Linux"
prompt = "$"
command = "curl -fsSL https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.sh | bash"
note = "No package manager or Go required. The script selects the archive for your OS and CPU, verifies it, and installs the binary."
[[workflow.installers]]
id = "go"
label = "Go"
prompt = "$"
command = "go install github.com/chemaclass/agnostic-ai/cmd/agnostic-ai@latest"
note = "Any platform with Go 1.24+. Make sure `$(go env GOPATH)/bin` is on your `PATH`."
[[workflow.installers]]
id = "binary"
label = "Binary"
prompt = "$"
command = "curl -sSL https://github.com/Chemaclass/agnostic-ai/releases/latest/download/agnostic-ai_darwin_arm64.tar.gz | tar xz"
note = "Swap `darwin_arm64` for your release archive. Windows builds and `checksums.txt` are on the releases page."

[[workflow.features]]
title = "Byte-stable, reviewable"
body = "Stateless adapters mean the same input produces the same output. Generated files diff cleanly."
[[workflow.features]]
title = "Round-trip safe"
body = "A provenance marker and style preservation keep `import` then `sync` byte-stable."
[[workflow.features]]
title = "Scoped rules"
body = "`rules/backend/auth.md` routes to each target's native directory and scope syntax."
[[workflow.features]]
title = "CI gate in one line"
body = "The check action fails a pull request when generated configuration drifts from source."

[updates]
title = "Keep the setup current."
muted_title = "Know what changed."
body = "Release briefings separate shipped agnostic-ai support from verified upstream CLI and model changes, so teams can act on the changes that affect their tools."
latest_label = "Latest briefing"
primary_label = "Read the latest briefing"
archive_label = "Browse all updates"
rss_label = "Subscribe by RSS"

[closing]
title = "Bring your existing setup."
second_line = "Keep every target in sync."
command = "agnostic-ai init --from all"
primary_label = "Read getting started"
secondary_label = "Set up with an agent"

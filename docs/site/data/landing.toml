[hero]
title = "One setup."
accent_title = "Every AI CLI."
body = "Keep agents, skills, rules, hooks, and MCP servers in **one portable source**. agnostic-ai writes each tool's native files and checks them for drift."
primary_label = "Install and start"
secondary_label = "Try in the browser"
facts = "25 targets. 10 portable spec kinds. Byte-stable output."
install_label = "Recommended installer"
install_link_label = "All install options"

[hero.diagram]
source_name = ".agnostic-ai/rules/commits.md"
source = """---
name: conventional-commits
globs: \"**/*\"
---
Use Conventional Commits."""
outputs = [
  "CLAUDE.md",
  ".cursor/rules/commits.mdc",
  "GEMINI.md · AGENTS.md",
  ".junie/AGENTS.md · .kiro/steering · +13",
]

[targets]
title = "One source of truth,"
muted_title = "25 tools, each native."
body = "Compare ten of the broadest integrations across the configuration surfaces teams use most. **Yes** means an adapter path exists. Open a tool for defaults, opt-ins, and caveats."
features = ["Rules", "Agents", "Skills", "MCP", "Hooks", "Commands", "Permissions"]
caption = "Permissions means portable allow, deny, and ask settings."
link_label = "See paths and all 25 targets"


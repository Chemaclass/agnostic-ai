[workflow]
title = "Two layers,"
muted_title = "one command."
body = "Drop a file in `.agnostic-ai/`, then run `agnostic-ai sync`. Each target gets a slim shared entry point and the real spec rendered into that tool's native location."

[[workflow.steps]]
title = "Write once"
body = "Add one Markdown file with YAML frontmatter under `.agnostic-ai/rules/`, `agents/`, `skills/`, `hooks/`, or `mcps/`."
[[workflow.steps]]
title = "Emit native"
body = "Stateless adapters write each target's format at the path it loads. Same input, same bytes. Run targets in parallel with `--jobs`."
[[workflow.steps]]
title = "Never drift"
body = "`sync --check` re-emits in memory and fails CI on any difference. `import` pulls existing configuration back into specs."

[[workflow.installers]]
id = "brew"
label = "Homebrew"
prompt = "$"
command = "brew install --cask Chemaclass/tap/agnostic-ai"
note = "macOS. Upgrade with `brew update && brew upgrade --cask Chemaclass/tap/agnostic-ai`."
[[workflow.installers]]
id = "windows"
label = "Windows"
prompt = ">"
command = "irm https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.ps1 | iex"
note = "Windows 10 and 11, in PowerShell. The script selects your CPU archive, checks it, and adds the binary to `PATH`."
[[workflow.installers]]
id = "script"
label = "Script"
prompt = "$"
command = "curl -fsSL https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/scripts/install.sh | bash"
note = "No package manager or Go required. The script selects the archive for your OS and CPU, verifies it, and installs the binary."
[[workflow.installers]]
id = "go"
label = "Go"
prompt = "$"
command = "go install github.com/chemaclass/agnostic-ai/cmd/agnostic-ai@latest"
note = "Any platform with Go 1.24+. Make sure `$(go env GOPATH)/bin` is on your `PATH`."
[[workflow.installers]]
id = "binary"
label = "Binary"
prompt = "$"
command = "curl -sSL https://github.com/Chemaclass/agnostic-ai/releases/latest/download/agnostic-ai_darwin_arm64.tar.gz | tar xz"
note = "Swap `darwin_arm64` for your release archive. Windows builds and `checksums.txt` are on the releases page."

[workflow.example]
source_name = ".agnostic-ai/rules/conventional-commits.md"
source = """---
name: conventional-commits
description: Always use Conventional Commits.
globs: \"**/*\"
alwaysApply: true
---

Use Conventional Commits. Subject under
72 chars. Body explains why, not what."""
output_name = ".cursor/rules/conventional-commits.mdc"
output = """---
description: Always use Conventional Commits.
globs: \"**/*\"
---
<!-- Generated by agnostic-ai -->
Use Conventional Commits. Subject under 72 chars."""

[[workflow.features]]
title = "Byte-stable, reviewable"
body = "Stateless adapters mean the same input produces the same output. Generated files diff cleanly."
[[workflow.features]]
title = "Round-trip safe"
body = "A provenance marker and style preservation keep `import` then `sync` byte-stable."
[[workflow.features]]
title = "Scoped rules"
body = "`rules/backend/auth.md` routes to each target's native directory and scope syntax."
[[workflow.features]]
title = "CI gate in one line"
body = "The check action fails a pull request when generated configuration drifts from source."

[closing]
title = "Write the rule once."
second_line = "Every AI tool obeys it."
command = "go install github.com/chemaclass/agnostic-ai/cmd/agnostic-ai@latest"
primary_label = "Open the playground"
secondary_label = "Read the docs"

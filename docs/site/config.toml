base_url = "https://agnostic-ai.org"
title = "agnostic-ai"
description = "One source of truth for AI coding agents, skills, rules, hooks, commands, and MCP servers."
default_language = "en"
author = "Chemaclass"
compile_sass = false
build_search_index = false
generate_feeds = false
feed_filenames = ["feed.xml"]

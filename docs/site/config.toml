base_url = "https://agnostic-ai.org"
title = "agnostic-ai"
description = "One source of truth for AI coding agents, skills, rules, hooks, commands, and MCP servers."
default_language = "en"
author = "Chemaclass"
compile_sass = false
build_search_index = false
generate_feeds = false
feed_filenames = ["feed.xml"]
generate_sitemap = false
generate_robots_txt = false
minify_html = false

# Zola 0.23 templates every content file, so pages that document literal
# `{{ ... }}` placeholders have to opt out or Tera reads them as expressions.
skip_content_templating = [
  "docs/spec-format.md",
  "docs/targets/claude.md",
  "docs/targets/kiro.md",
  "docs/targets/warp.md",
]

[markdown]
external_links_target_blank = false
external_links_no_follow = false
external_links_no_referrer = false
smart_punctuation = false

[slugify]
paths = "safe"
anchors = "on"

[extra]
repository_url = "https://github.com/Chemaclass/agnostic-ai"
author_url = "https://chemaclass.com"
sponsor_url = "https://chemaclass.com/sponsor"
version = "v0.69.0"
image_url = "https://agnostic-ai.org/og.png"
agent_setup_prompt = "Set up agnostic-ai in this repository. Follow https://agnostic-ai.org/agent-setup.txt exactly. Preserve existing AI tool behavior, import native configuration before syncing, and finish with agnostic-ai sync --check. Summarize the targets selected and every file changed."

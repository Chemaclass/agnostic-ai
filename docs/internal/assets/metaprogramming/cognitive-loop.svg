<svg xmlns="http://www.w3.org/2000/svg" width="736" height="1254" viewBox="0 0 736 1254"><style>text{font-family:DejaVu Sans,sans-serif;font-size:14px;fill:#172539}.text-small{font-size:12px}.secondary{fill:#536176}.wire{stroke:#536176;stroke-width:1.2;fill:none}.memory-link{stroke-dasharray:4 4}</style><rect width="736" height="1254" fill="#ffffff"/><text x="368" y="34" text-anchor="middle" style="font-size:23px;font-weight:500">Cognitive harness: the outer loop</text><text x="368" y="61" text-anchor="middle" class="secondary">Human + AI turn intent into outcomes and improve how they work</text><circle cx="201" cy="91" r="4.5" fill="#266ccc"/><text x="214" y="95" class="text-small">Knowledge</text><circle cx="339" cy="91" r="4.5" fill="#ae701a"/><text x="352" y="95" class="text-small">Action</text><circle cx="439" cy="91" r="4.5" fill="#168574"/><text x="452" y="95" class="text-small">Verification</text><g transform="translate(0 122)"><desc >Human and AI clarify intent and specify the work. Direction enters the nested agent loop as task, context, authority and success criteria. The agent returns results, evidence and uncertainty for human review. Questions and decisions cross the boundary during execution. Review can request revision. Accepted work is deployed and its outcomes observed. Lessons update shared state, revise future intent and may change the harness configuration. Both loops read and update persistent state.</desc><defs ><marker id="outer-loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#536176" stroke-width="1.2"></path></marker></defs><rect x="158" y="28" width="420" height="80" rx="7" fill="#266ccc" fill-opacity=".10"></rect><rect x="158" y="40" width="3" height="56" rx="1" fill="#266ccc"></rect><text x="368" y="52" text-anchor="middle" class="" font-weight="500">Clarify intent &amp; specify</text><text x="368" y="73" text-anchor="middle" class="text-small secondary" font-weight="400">Human + AI agree on the task</text><text x="368" y="91" text-anchor="middle" class="text-small secondary" font-weight="400">Goals · constraints · trade-offs</text><path d="M368 108 V130" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M368 201 V234" class="wire" marker-end="url(#outer-loop-arrow)"></path><text x="368" y="145" text-anchor="middle" class="text-small secondary" font-weight="400">DIRECTION ↓</text><text x="368" y="169" text-anchor="middle" class="text-small secondary" font-weight="400">Task / spec + relevant context</text><text x="368" y="189" text-anchor="middle" class="text-small secondary" font-weight="400">Authority + success criteria</text><rect x="38" y="238" width="660" height="336" rx="10" fill="none" stroke="#bfcbd9" stroke-width="1.2"></rect><text x="368" y="263" text-anchor="middle" class="" font-weight="500">AGENT LOOP</text><rect x="52" y="288" width="294" height="60" rx="7" fill="#266ccc" fill-opacity=".10"></rect><rect x="52" y="300" width="3" height="36" rx="1" fill="#266ccc"></rect><text x="199" y="312" text-anchor="middle" class="" font-weight="500">State / memory</text><text x="199" y="333" text-anchor="middle" class="text-small secondary" font-weight="400">Shared with outer</text><rect x="390" y="288" width="294" height="60" rx="7" fill="#266ccc" fill-opacity=".10"></rect><rect x="390" y="300" width="3" height="36" rx="1" fill="#266ccc"></rect><text x="537" y="312" text-anchor="middle" class="" font-weight="500">Context</text><rect x="52" y="386" width="294" height="60" rx="7" fill="#168574" fill-opacity=".10"></rect><rect x="52" y="398" width="3" height="36" rx="1" fill="#168574"></rect><text x="199" y="410" text-anchor="middle" class="" font-weight="500">Verification</text><rect x="390" y="386" width="294" height="60" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="390" y="398" width="3" height="36" rx="1" fill="#ae701a"></rect><text x="537" y="410" text-anchor="middle" class="" font-weight="500">Control loop</text><rect x="52" y="484" width="294" height="60" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="52" y="496" width="3" height="36" rx="1" fill="#ae701a"></rect><text x="199" y="508" text-anchor="middle" class="" font-weight="500">Tools</text><rect x="390" y="484" width="294" height="60" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="390" y="496" width="3" height="36" rx="1" fill="#ae701a"></rect><text x="537" y="508" text-anchor="middle" class="" font-weight="500">Authority</text><path d="M346 318 H386" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M537 348 V382" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M346 416 H386" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M537 446 V480" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M390 514 H350" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M199 484 V450" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M199 386 V352" class="wire" marker-end="url(#outer-loop-arrow)"></path><text x="368" y="565" text-anchor="middle" class="text-small secondary" font-weight="400">Same inner loop as diagram 1</text><path d="M684 416 H726 V68 H582" class="wire" marker-end="url(#outer-loop-arrow)" marker-start="url(#outer-loop-arrow)"></path><text x="719" y="241" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 719 241)">Questions ↑ · decisions / corrections ↓</text><path d="M368 574 V588" class="wire" marker-end="url(#outer-loop-arrow)"></path><path d="M368 640 V660" class="wire" marker-end="url(#outer-loop-arrow)"></path><text x="368" y="606" text-anchor="middle" class="text-small secondary" font-weight="400">RETURN TO HUMAN REVIEW</text><text x="368" y="629" text-anchor="middle" class="text-small secondary" font-weight="400">Artifacts · evidence · uncertainty</text><rect x="158" y="664" width="420" height="80" rx="7" fill="#168574" fill-opacity=".10"></rect><rect x="158" y="676" width="3" height="56" rx="1" fill="#168574"></rect><text x="368" y="688" text-anchor="middle" class="" font-weight="500">Human review</text><text x="368" y="709" text-anchor="middle" class="text-small secondary" font-weight="400">Accept · revise · redirect</text><text x="368" y="727" text-anchor="middle" class="text-small secondary" font-weight="400">Judge usefulness and trade-offs</text><path d="M158 701 H46 V570" class="wire" marker-end="url(#outer-loop-arrow)"></path><text x="77" y="650" text-anchor="middle" class="text-small secondary" font-weight="400">revise</text><path d="M368 744 V786" class="wire" marker-end="url(#outer-loop-arrow)"></path><text x="376" y="771" text-anchor="start" class="text-small secondary" font-weight="400">accept</text><rect x="158" y="790" width="420" height="80" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="158" y="802" width="3" height="56" rx="1" fill="#ae701a"></rect><text x="368" y="814" text-anchor="middle" class="" font-weight="500">Deploy &amp; observe</text><text x="368" y="835" text-anchor="middle" class="text-small secondary" font-weight="400">Use the result in the world</text><text x="368" y="853" text-anchor="middle" class="text-small secondary" font-weight="400">Compare outcomes with intent</text><path d="M368 870 V912" class="wire" marker-end="url(#outer-loop-arrow)"></path><rect x="158" y="916" width="420" height="80" rx="7" fill="#266ccc" fill-opacity=".10"></rect><rect x="158" y="928" width="3" height="56" rx="1" fill="#266ccc"></rect><text x="368" y="940" text-anchor="middle" class="" font-weight="500">Learn &amp; improve</text><text x="368" y="961" text-anchor="middle" class="text-small secondary" font-weight="400">Retain lessons; update decisions</text><text x="368" y="979" text-anchor="middle" class="text-small secondary" font-weight="400">Reconsider the way of working</text><path d="M158 954 H12 V68 H154" class="wire" marker-end="url(#outer-loop-arrow)"></path><text x="23" y="592" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 23 592)">New priorities / revised intent</text><path d="M158 975 H29 V318 H48" class="wire memory-link" marker-end="url(#outer-loop-arrow)"></path><text x="35" y="829" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 35 829)">Retain lessons in shared state</text><path d="M52 318 H29 V88 H154" class="wire memory-link" marker-end="url(#outer-loop-arrow)"></path><text x="35" y="190" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 35 190)">Recall relevant state</text><path d="M578 954 H707 V554 H694" class="wire memory-link" marker-end="url(#outer-loop-arrow)"></path><text x="701" y="804" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 701 804)">Metaprogramming: configure / integrate</text><text x="368" y="1033" text-anchor="middle" class="text-small secondary" font-weight="400">Shared state informs both loops.</text><text x="368" y="1055" text-anchor="middle" class="text-small secondary" font-weight="400">Human review can also contribute lessons.</text></g><text x="368" y="1234" text-anchor="middle" class="text-small secondary">Human judgment participates throughout; review is one explicit checkpoint.</text></svg>
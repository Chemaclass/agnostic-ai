<div id="aai-screens">
<style>
#aai-screens{--paper:light-dark(#f7f8fa,#15181e);--panel:light-dark(#ffffff,#1d222a);--ink:light-dark(#202b36,#e4eaf1);--sub:light-dark(#62707e,#a8b3c1);--line:light-dark(#dce2e8,#37414c);--wash:light-dark(#edf2f5,#28323c);--brand:light-dark(#126b68,#80d3c7);--tint:light-dark(#e5f2ee,#203b37);--warn:light-dark(#855f1c,#e8c077);color:var(--ink);background:var(--paper);font:14px/1.5 system-ui,sans-serif;border:1px solid var(--line);border-radius:16px;overflow:hidden}
#aai-screens *{box-sizing:border-box}#aai-screens button,#aai-screens select{font:inherit;color:inherit}#aai-screens button{cursor:pointer}#aai-screens button:focus-visible,#aai-screens select:focus-visible{outline:2px solid var(--brand);outline-offset:3px}#aai-screens button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left}#aai-screens button:hover{background:var(--wash)}#aai-screens .top{padding:17px 22px;background:var(--panel);display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}#aai-screens .logo{font-weight:650;letter-spacing:-.6px;font-size:20px}#aai-screens .muted{color:var(--sub)}#aai-screens .small{font-size:12px}#aai-screens .badge{padding:4px 8px;background:var(--wash);border-radius:5px;font-size:12px}#aai-screens .spacer{flex:1}#aai-screens .shell{display:grid;grid-template-columns:178px minmax(0,1fr)}#aai-screens aside{padding:22px 12px;background:var(--panel);border-right:1px solid var(--line)}#aai-screens .navlabel{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--sub);margin:18px 10px 8px;text-transform:uppercase}#aai-screens aside button{display:block;width:100%;background:transparent;border-color:transparent;margin:3px 0}#aai-screens aside button.active{background:var(--tint);color:var(--brand);font-weight:600}#aai-screens main{padding:24px;min-width:0}#aai-screens .filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}#aai-screens label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px}#aai-screens select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px;max-width:100%}#aai-screens h1{font-size:26px;letter-spacing:-.7px;line-height:1.2;margin:0 0 8px;font-weight:600}#aai-screens h2{font-size:17px;margin:0 0 12px;font-weight:600}#aai-screens h3{font-size:14px;margin:0 0 7px;font-weight:600}#aai-screens p{margin:0 0 15px}#aai-screens .crumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:18px;color:var(--sub);font-size:12px}#aai-screens .crumb button{border:0;background:none;padding:0;font-size:12px;color:var(--brand)}#aai-screens .outer{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:20px;background:var(--panel)}#aai-screens .loophead{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px;align-items:center}#aai-screens .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#aai-screens .stage{background:var(--wash);border-radius:7px;padding:10px;font-size:12px}#aai-screens .stage strong{display:block;font-size:14px;font-weight:500}#aai-screens .interface{text-align:center;color:var(--sub);font-size:12px;padding:13px 0}#aai-screens .inner{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:15px}#aai-screens .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#aai-screens .tile{min-height:117px;display:flex;flex-direction:column;gap:5px;padding:14px}#aai-screens .tile strong{font-size:15px;font-weight:600}#aai-screens .tile .count{margin-top:auto;color:var(--brand);font-size:12px}#aai-screens .learn{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}#aai-screens .list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}#aai-screens .item{display:flex;gap:12px;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px}#aai-screens .item:last-child{border-bottom:0}#aai-screens .item strong{display:block;font-weight:550}#aai-screens .tag{color:var(--brand);font-size:12px;white-space:nowrap}#aai-screens .twocol{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}#aai-screens .box{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:16px}#aai-screens .relation{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}#aai-screens .relation:last-child{border-bottom:0}#aai-screens .relation span{color:var(--sub);display:block;font-size:12px}#aai-screens pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);padding:15px;border-radius:8px;font:12px/1.7 ui-monospace,monospace;margin:12px 0 0;color:var(--ink)}#aai-screens .switch{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap}#aai-screens .switch button.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}#aai-screens .notice{padding:12px 14px;background:var(--wash);border-radius:8px;font-size:12px;color:var(--sub);margin-top:16px}#aai-screens .warn{color:var(--warn)}#aai-screens .tablewrap{overflow-x:auto}#aai-screens table{border-collapse:collapse;width:100%;font-size:12px}#aai-screens th,#aai-screens td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}#aai-screens th{font-weight:550;color:var(--sub)}#aai-screens .foot{border-top:1px solid var(--line);padding:10px 22px;background:var(--panel);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:11px}#aai-screens .empty{padding:25px;color:var(--sub)}
@media(max-width:760px){#aai-screens .shell{grid-template-columns:1fr}#aai-screens aside{display:flex;gap:4px;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}#aai-screens aside button{width:auto;font-size:12px;margin:0;padding:7px 9px}#aai-screens .navlabel{display:none}#aai-screens main{padding:17px}#aai-screens .twocol{grid-template-columns:1fr}#aai-screens .grid{grid-template-columns:repeat(2,minmax(0,1fr))}#aai-screens .top{padding:14px}#aai-screens .outer{padding:12px}}
@media(max-width:420px){#aai-screens .stages{grid-template-columns:1fr}#aai-screens .grid{grid-template-columns:1fr}#aai-screens .tile{min-height:90px}#aai-screens .filters{display:block}#aai-screens label{margin:8px 0}#aai-screens .learn{align-items:flex-start;flex-direction:column}#aai-screens .item{align-items:flex-start}#aai-screens h1{font-size:23px}}
</style>
<header class="top"><span class="logo">agnostic<span class="muted"> ai</span></span><span class="muted">/</span><span>My workspace</span><span class="spacer"></span><span class="badge">Illustrative setup</span><span class="small muted">Read-only</span></header>
<div class="shell"><aside aria-label="Harness navigation"><div class="navlabel">Cognitive harness</div><button data-page="overview">Overview</button><div class="navlabel">Agent harness</div><button data-section="Context">Context</button><button data-section="Memory">Memory</button><button data-section="Control">Control</button><button data-section="Authority">Authority</button><button data-section="Tools">Tools</button><button data-section="Verification">Verification</button><div class="navlabel">Inspect</div><button data-page="coverage">Tool coverage</button></aside><main><div class="filters"><label>Scope <select id="aai-scope"><option>All scopes</option><option>Project</option><option>Personal</option></select></label><label>Coding tool <select id="aai-tool"><option>All tools</option><option>Claude Code</option><option>Codex</option></select></label></div><div id="aai-content" aria-live="polite"></div></main></div><footer class="foot"><span>Configuration view · runtime activity not connected</span><span id="aai-screen-label">System overview</span></footer>
<script>
(()=>{
const root=document.getElementById('aai-screens'),out=root.querySelector('#aai-content'),scope=root.querySelector('#aai-scope'),tool=root.querySelector('#aai-tool');
const data={Context:[['Project instructions','Instructions','Project','Shared purpose and project conventions'],['Test before delivery','Rule','Project','Require evidence before presenting work'],['Review a change','Skill','Project','Assess a diff against the agreed intent'],['Response style','Rule','Personal','Concise explanations and explicit uncertainty']],Memory:[['Project decisions','Memory','Project','Decisions and their reasons'],['My preferences','Memory','Personal','Corrections that carry across sessions'],['Current handoff','Handoff','Personal','Goal, progress and open questions']],Control:[['Reviewer','Agent','Project','A specialist for examining changes'],['After-edit checks','Hook','Project','Run configured checks after edits'],['Model defaults','Settings','Personal','Model and effort by coding tool']],Authority:[['Project permissions','Permissions','Project','Allowed actions and approval boundaries'],['Protect CI files','Protected paths','Project','Ask before editing workflow configuration']],Tools:[['GitHub','MCP server','Project','Repository and issue access'],['Development workspace','Environment','Project','Dependencies and preview commands']],Verification:[['Review standards','Review instructions','Project','What a review must consider']]};
const subtitles={Context:'What the agent is told',Memory:'What survives a session',Control:'How execution is shaped',Authority:'What the agent may do',Tools:'What the agent can use',Verification:'How work is checked'};
let page='overview',section='Context',selected=null,tab='Meaning';
const items=s=>data[s].filter(x=>scope.value==='All scopes'||x[2]===scope.value);
const crumb=(tail='')=>`<div class="crumb"><button data-page="overview">Harness</button><span>/</span><button data-section="${section}">${section}</button>${tail?'<span>/</span><span>'+tail+'</span>':''}</div>`;
function render(){
root.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='section'||page==='item')&&b.dataset.section===section));
root.querySelector('#aai-screen-label').textContent=({overview:'Screen 1 · System overview',section:'Screen 2 · Component',item:'Screen 3 · Item detail',coverage:'Screen 4 · Tool coverage'})[page];
const target=tool.value==='All tools'?'Claude Code + Codex':tool.value;
if(page==='overview')out.innerHTML=`<h1>Your cognitive harness</h1><p class="muted">One view of the setup behind your work.</p><div class="outer"><div class="loophead"><h2 style="margin:0">Human + AI</h2><span class="small muted">Outer loop</span></div><div class="stages"><div class="stage"><strong>Intent & specification</strong>Goals · constraints · success criteria</div><div class="stage"><strong>Human judgment</strong>Questions · corrections · decisions</div><div class="stage"><strong>Outcomes & feedback</strong>Review · use · observe</div></div><div class="interface">↓ Task, context and authority &nbsp; · &nbsp; ↑ Results, evidence and uncertainty</div><div class="inner"><div class="loophead"><h2 style="margin:0">Agent harness</h2><span class="small muted">${target}</span></div><div class="grid">${Object.keys(data).map(s=>`<button class="tile" data-section="${s}"><strong>${s} <span class="muted">↗</span></strong><span class="small muted">${subtitles[s]}</span><span class="count">${items(s).length} configured items</span></button>`).join('')}</div></div><div class="learn"><div><strong>Learn & improve</strong><div class="small muted">Memory and handoffs carry lessons into future work.</div></div><button data-section="Memory">Explore memory →</button></div></div><div class="notice">Outer-loop stages are orientation. Their tasks and decisions are not tracked in this configuration view.</div>`;
if(page==='section')out.innerHTML=crumb()+`<h1>${section}</h1><p class="muted">${subtitles[section]} · ${target}</p><div class="list">${items(section).map(x=>`<button class="item" data-item="${x[0]}"><span><strong>${x[0]}</strong><span class="small muted">${x[1]} · ${x[3]}</span></span><span class="tag">${x[2]} ↗</span></button>`).join('')||'<div class="empty">No items in this scope.</div>'}</div><div class="box"><h2>Connections to the rest of the harness</h2>${(section==='Context'?[['Memory → Context','Relevant saved knowledge becomes active context.'],['Context → Control','Instructions shape the work performed.'],['Verification → Context','Evidence informs the next step.']]:section==='Memory'?[['Context → Memory','Useful findings can persist.'],['Memory → Context','Stored knowledge informs future sessions.'],['Human → Memory','Preferences and approved lessons shape future work.']]:[[section+' ↔ Context','Configuration and results inform the agent.'],['Human ↔ '+section,'The human defines intent and reviews the setup.']]).map(x=>`<div class="relation">${x[0]}<span>${x[1]}</span></div>`).join('')}</div>`;
if(page==='item'){
const x=selected;out.innerHTML=crumb(x[0])+`<h1>${x[0]}</h1><p class="muted">${x[1]} · ${x[2]} scope · ${section}</p><div class="switch" aria-label="Item detail views">${['Meaning','Source','Effective setup'].map(t=>`<button data-tab="${t}" aria-pressed="${tab===t}" class="${tab===t?'active':''}">${t}</button>`).join('')}</div>`;
if(tab==='Meaning')out.innerHTML+=`<div class="twocol"><div class="box"><h2>Purpose</h2><p>${x[3]}.</p><h3>Configured content</h3><p>${x[0]==='Test before delivery'?'Before presenting a change as complete, run the relevant checks. Report the evidence and disclose any checks you could not run.':x[3]+'. This example represents the content you would inspect here.'}</p><span class="badge">${x[1]}</span></div><div class="box"><h2>Where it fits</h2><div class="relation">${section}<span>Primary home in the harness</span></div><div class="relation">${x[0]==='Test before delivery'?'Verification':'Context'}<span>${x[0]==='Test before delivery'?'Also guides what evidence the agent should provide':'Connected through the agent’s configured instructions'}</span></div><div class="relation">${target}<span>Selected delivery targets</span></div></div></div>`;
if(tab==='Source')out.innerHTML+=`<div class="box"><h2>Canonical source</h2><div class="small muted">${x[0]==='Test before delivery'?'.agnostic-ai/rules/test-before-delivery.md':'Example source for '+x[0]}</div><pre>${x[0]==='Test before delivery'?'---\nname: test-before-delivery\ndescription: Require evidence before presenting work\n---\n\nBefore presenting a change as complete, run the relevant checks.\nReport the evidence and disclose any checks you could not run.':x[3]+'.'}</pre></div>`;
if(tab==='Effective setup')out.innerHTML+=`<div class="box"><h2>Source and precedence</h2><div class="relation">${x[2]} configuration<span>Supplies this item</span></div><div class="relation">No overriding item in this example<span>Source content remains effective</span></div><h3 style="margin-top:20px">Generated destinations</h3>${(tool.value==='All tools'?['Claude Code','Codex']:[tool.value]).map(t=>`<div class="relation">${t}<span>${x[0]==='Test before delivery'?(t==='Codex'?'AGENTS.md · merged rule section':'.claude/rules/test-before-delivery.md'):'Native configuration for '+x[1].toLowerCase()}</span></div>`).join('')}</div><div class="notice">Written configuration is visible here. Whether the agent loaded or followed it is not observed.</div>`;
}
if(page==='coverage')out.innerHTML=`<div class="crumb"><button data-page="overview">Harness</button><span>/ Tool coverage</span></div><h1>One setup, different tools</h1><p class="muted">See where your configuration lands and where its meaning changes.</p><div class="box"><div class="tablewrap"><table><thead><tr><th>Feature</th>${(tool.value==='All tools'?['Claude Code','Codex']:[tool.value]).map(t=>'<th>'+t+'</th>').join('')}</tr></thead><tbody>${[['Instructions','CLAUDE.md','AGENTS.md'],['Skills','Native skills','Native skills'],['Review instructions','No dedicated output','AGENTS.md review section'],['Permissions','Native policies','Partial · shell policy opt-in']].map(row=>`<tr><td>${row[0]}</td>${(tool.value==='All tools'?[1,2]:[tool.value==='Codex'?2:1]).map(i=>`<td class="${row[i].includes('Partial')||row[i].includes('No dedicated')?'warn':''}">${row[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="box"><h2>A difference worth understanding</h2><p>Review guidance has a dedicated mapping for Codex. Claude Code does not receive review specs through that feature.</p><button data-section="Verification">Inspect review instructions →</button></div><div class="notice">Illustrative target comparison · support depends on fields, scope and enabled output options.</div>`;
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;}else if(b.dataset.section){section=b.dataset.section;page='section';}else if(b.dataset.item){selected=data[section].find(x=>x[0]===b.dataset.item);page='item';tab='Meaning';}else if(b.dataset.tab){tab=b.dataset.tab;}else return;render();});
scope.addEventListener('change',()=>{if(page==='item'&&scope.value!=='All scopes'&&selected[2]!==scope.value)page='section';render();});tool.addEventListener('change',render);render();
})();
</script>
</div>

<svg xmlns="http://www.w3.org/2000/svg" width="736" height="834" viewBox="0 0 736 834"><style>text{font-family:DejaVu Sans,sans-serif;font-size:14px;fill:#172539}.text-small{font-size:12px}.secondary{fill:#536176}.wire{stroke:#536176;stroke-width:1.2;fill:none}.memory-link{stroke-dasharray:4 4}</style><rect width="736" height="834" fill="#ffffff"/><text x="368" y="34" text-anchor="middle" style="font-size:23px;font-weight:500">Agent harness: the inner loop</text><text x="368" y="61" text-anchor="middle" class="secondary">Carry out the task within the agreed boundaries</text><circle cx="201" cy="91" r="4.5" fill="#266ccc"/><text x="214" y="95" class="text-small">Knowledge</text><circle cx="339" cy="91" r="4.5" fill="#ae701a"/><text x="352" y="95" class="text-small">Action</text><circle cx="439" cy="91" r="4.5" fill="#168574"/><text x="452" y="95" class="text-small">Verification</text><g transform="translate(0 122)"><desc >Persistent state supplies selected context. The control loop uses context to reason and propose an action. Authority permits, blocks or asks. Tools produce observations, which return to context, and evidence for verification. Verification informs the loop and saves relevant findings to state. Criteria met leads to results returned to the outer loop. Questions can be escalated during execution. Durability is a property of persistence and recovery, not a separate component.</desc><defs ><marker id="inner-loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#536176" stroke-width="1.2"></path></marker></defs><text x="368" y="20" text-anchor="middle" class="text-small secondary" font-weight="400">FROM THE OUTER LOOP</text><text x="368" y="40" text-anchor="middle" class="text-small secondary" font-weight="400">Task · context · authority · success criteria</text><path d="M552 50 V96" class="wire" marker-end="url(#inner-loop-arrow)"></path><rect x="26" y="100" width="316" height="84" rx="7" fill="#266ccc" fill-opacity=".10"></rect><rect x="26" y="112" width="3" height="60" rx="1" fill="#266ccc"></rect><text x="184" y="124" text-anchor="middle" class="" font-weight="500">State / memory</text><text x="184" y="145" text-anchor="middle" class="text-small secondary" font-weight="400">Facts · decisions</text><text x="184" y="163" text-anchor="middle" class="text-small secondary" font-weight="400">Progress · evidence</text><rect x="394" y="100" width="316" height="84" rx="7" fill="#266ccc" fill-opacity=".10"></rect><rect x="394" y="112" width="3" height="60" rx="1" fill="#266ccc"></rect><text x="552" y="124" text-anchor="middle" class="" font-weight="500">Context</text><text x="552" y="145" text-anchor="middle" class="text-small secondary" font-weight="400">Selected knowledge</text><text x="552" y="163" text-anchor="middle" class="text-small secondary" font-weight="400">Visible this step</text><path d="M342 142 H390" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="368" y="129" text-anchor="middle" class="text-small secondary" font-weight="400">retrieve</text><path d="M552 184 V276" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="560" y="235" text-anchor="start" class="text-small secondary" font-weight="400">inform</text><rect x="394" y="280" width="316" height="84" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="394" y="292" width="3" height="60" rx="1" fill="#ae701a"></rect><text x="552" y="304" text-anchor="middle" class="" font-weight="500">Control loop</text><text x="552" y="325" text-anchor="middle" class="text-small secondary" font-weight="400">Reason · decide</text><text x="552" y="343" text-anchor="middle" class="text-small secondary" font-weight="400">Ask · stop · repeat</text><rect x="26" y="280" width="316" height="84" rx="7" fill="#168574" fill-opacity=".10"></rect><rect x="26" y="292" width="3" height="60" rx="1" fill="#168574"></rect><text x="184" y="304" text-anchor="middle" class="" font-weight="500">Verification</text><text x="184" y="325" text-anchor="middle" class="text-small secondary" font-weight="400">Check the evidence</text><text x="184" y="343" text-anchor="middle" class="text-small secondary" font-weight="400">Against criteria</text><path d="M342 322 H390" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="368" y="309" text-anchor="middle" class="text-small secondary" font-weight="400">feedback</text><path d="M184 280 V188" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="192" y="235" text-anchor="start" class="text-small secondary" font-weight="400">save</text><path d="M552 364 V456" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="560" y="415" text-anchor="start" class="text-small secondary" font-weight="400">propose</text><rect x="394" y="460" width="316" height="84" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="394" y="472" width="3" height="60" rx="1" fill="#ae701a"></rect><text x="552" y="484" text-anchor="middle" class="" font-weight="500">Authority</text><text x="552" y="505" text-anchor="middle" class="text-small secondary" font-weight="400">Permit · block · ask</text><text x="552" y="523" text-anchor="middle" class="text-small secondary" font-weight="400">Bounded access</text><rect x="26" y="460" width="316" height="84" rx="7" fill="#ae701a" fill-opacity=".10"></rect><rect x="26" y="472" width="3" height="60" rx="1" fill="#ae701a"></rect><text x="184" y="484" text-anchor="middle" class="" font-weight="500">Tools</text><text x="184" y="505" text-anchor="middle" class="text-small secondary" font-weight="400">Act on the world</text><text x="184" y="523" text-anchor="middle" class="text-small secondary" font-weight="400">Return results</text><path d="M394 502 H346" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="368" y="489" text-anchor="middle" class="text-small secondary" font-weight="400">allowed</text><path d="M184 460 V368" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="192" y="415" text-anchor="start" class="text-small secondary" font-weight="400">evidence</text><path d="M184 544 V574 H728 V142 H714" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="721" y="380" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 721 380)">observations → next context</text><path d="M26 322 H8 V623 H263" class="wire" marker-end="url(#inner-loop-arrow)"></path><text x="18" y="476" text-anchor="middle" class="text-small secondary" font-weight="400" transform="rotate(-90 18 476)">criteria met</text><text x="368" y="628" text-anchor="middle" class="" font-weight="500">Return result + evidence</text><text x="368" y="652" text-anchor="middle" class="text-small secondary" font-weight="400">Questions and blockers can return earlier.</text></g><text x="368" y="814" text-anchor="middle" class="text-small secondary">Recovery: persist state, restore relevant context, resume execution.</text></svg>
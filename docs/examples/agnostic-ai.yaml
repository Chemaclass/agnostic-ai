# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/main/docs/schemas/config.schema.json
# Starter config for Claude Code and Cursor. Save at your project root.
# Field reference: ../user/configuration.md
version: 1

# Select only the tools you use.
targets:
  - claude
  - cursor

# Sources default to .agnostic-ai/<kind>/, with no sources block needed.
# Override a source directory only when your project uses another layout:
# sources:
#   rules: config/ai/rules

# Output paths use each tool's native defaults. Look up target-specific
# overrides in ../user/targets.md before changing where a tool reads files.

# Report spec kinds a selected tool cannot use.
on-unsupported: warn

# Generated files stay local. Run sync after each fresh clone or worktree.
# To commit outputs instead, set this to false and remove their ignore entries.
gitignore:
  enabled: true

# Plugin coordinates
pluginGroup = com.agnosticai
pluginName = agnostic-ai
pluginVersion = 0.1.0

# IntelliJ Platform target. Bumping this drives both the compile-time
# dependency and the IDE the run/test tasks launch. Pick a recent stable
# Community build that supports the API surface we use.
platformVersion = 2024.2.5

# Plugin compatibility (IDE build numbers). 242 is 2024.2; 243 is
# 2024.3. Bump untilBuild only after a verifyPlugin run on the new
# release.
pluginSinceBuild = 242
pluginUntilBuild = 243.*

# Gradle wrapper version
gradleVersion = 9.0.0

# Speed up builds. Configuration cache is off because the bundled
# Kotlin Gradle plugin (registered by the IntelliJ Platform plugin)
# doesn't yet honor the Gradle 9.0 configuration-cache contract.
org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
